name: Site checks

# Builds the site and runs the regression guards in scripts/ (see scripts/README.md).
# Read-only: no secrets, no deploys, no privileged pull-request trigger. Netlify deploys on its own.
on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (the comment names the release the SHA belongs to).
      # SHAs verified against the GitHub API on 2026-10-28: tag -> commit, published releases.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Build, then: CMS structure and coverage, previews, copy trace, sentinel wiring, hostile input.
      - name: Build the site and run the guards
        run: npm run check
        env:
          # Pull requests (developer changes) also fail on allow-list / ignore entries that match nothing any more;
          # plain pushes (editors saving in the CMS) only note them, so switching a feature off never fails a build.
          GUARD_STRICT_STALE: ${{ github.event_name == 'pull_request' && '1' || '' }}

      # The accessibility result for the pull request. `npm run check` above already fails on accessibility errors
      # (it ends with check:a11y); this step runs the same gate again, even when an earlier guard failed, so the
      # result always shows up: as a table in the job summary and as ::error / ::warning annotations on the files
      # to change. It only writes to $GITHUB_STEP_SUMMARY and prints workflow commands: no comments, no tokens,
      # no write permission.
      - name: Accessibility result (job summary and annotations)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-a11y.js --github
        env:
          GUARD_STRICT_STALE: ${{ github.event_name == 'pull_request' && '1' || '' }}

      # Breaks a throwaway copy of the site in ~20 ways and requires the guards to notice each one.
      - name: Prove the guards still catch regressions
        run: npm run check:selftest
