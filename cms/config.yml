            fields:
              - { label: "ID", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, e.g. bristol"], hint: "A short tag the page uses to link the pin to its button — lowercase letters, numbers and dashes, different for every city (e.g. bristol). Never shown to visitors." }
              - { label: "City name", name: "name", widget: "string", hint: "Shown on the city’s button and as the heading of the description box." }
              - { label: "Map X position", name: "x", widget: "number", value_type: "float", min: 0, max: 2000, step: 1, hint: "How far across the map the pin’s tip sits, measured from the left edge in map units. On the current map (765 wide) use 0 for the far left to 765 for the far right." }
              - { label: "Map Y position", name: "y", widget: "number", value_type: "float", min: 0, max: 2000, step: 1, hint: "How far down the map the pin’s tip sits, measured from the top edge in map units. On the current map (1024 tall) use 0 for the top to 1024 for the bottom." }
              - { label: "Is this the live pilot city?", name: "live", widget: "boolean", default: false, hint: "Leave off while the city is parked. Cities only get the pilot pin and badge once they are moved into “Cities” above and switched on there." }
              - { label: "Description shown when selected", name: "blurb", widget: "text", hint: "The sentence or two that appears in the description box when someone picks this city." }
          - label: "Venue types targeted"
            name: "placeTypes"
            widget: "list"
            label_singular: "venue type"
            summary: "{{fields.emoji}} {{fields.label}}"
            hint: "The pills under the city description, e.g. Universities."
            fields:
              - { label: "Emoji", name: "emoji", widget: "string", hint: "One emoji shown before the label. Known ones (🎓 🛍️ 🏟️ 🚆 ☕ 📍) are swapped for the site’s own icon." }
              - { label: "Label", name: "label", widget: "string", hint: "The pill’s text, e.g. Universities." }
          - { label: "Venue types heading", name: "placeTypesTitle", widget: "string", hint: "Line above the venue-type pills." }
          - { label: "Button label", name: "ctaButton", widget: "string", hint: "Button at the bottom of the section. It jumps to the “For Venues” form and only appears while that section is switched on." }
          - label: "Map wording"
            name: "labels"
            widget: "object"
            collapsed: true
            hint: "Small pieces of text on and around the map."
            fields:
              - { label: "Legend — live pin", name: "legendLive", widget: "string", hint: "Caption under the map next to the filled, accent-coloured dot." }
              - { label: "Legend — roadmap pin", name: "legendSoon", widget: "string", hint: "Caption under the map next to the white dot with a dark outline." }
              - { label: "Tag for a live city", name: "statusLive", widget: "string", hint: "Small tag beside the city name in the description box when the selected city is live." }
              - { label: "Tag for a roadmap city", name: "statusSoon", widget: "string", hint: "Small tag beside the city name in the description box when the selected city is not live." }
              - { label: "Badge on a live city’s button", name: "liveBadge", widget: "string", required: false, hint: "Tiny badge after the name on the live city’s button, e.g. “● pilot”. Leave empty for no badge." }
              - { label: "City buttons description (screen readers)", name: "cityPickerAriaLabel", widget: "string", hint: "Read aloud by screen readers for the row of city buttons. Not shown on screen." }

      - name: "vision"
        label: "🚀 Vision / roadmap"
        file: "src/_data/vision.json"
        preview_path: "/"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string", hint: "The small label above the heading of the vision section." }
          - { label: "Heading (line breaks allowed, e.g. <br />)", name: "title", widget: "string", hint: "The big heading of the vision section. Type <br /> where you want a line break." }
          - label: "Milestones"
            name: "milestones"
            label_singular: "milestone"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            hint: "The roadmap cards. Drag to reorder."
            fields:
              - { label: "Phase tag", name: "tag", widget: "string", hint: "The small tag on top of the card, e.g. Phase 2." }
              - { label: "Title", name: "title", widget: "string", hint: "The bold milestone name." }
              - { label: "Description", name: "desc", widget: "text", hint: "The sentence under the title." }
          - { label: "'Build in public' heading", name: "bipTitle", widget: "string", hint: "The heading of the build-in-public box (an emoji at the start is fine)." }
          - { label: "'Build in public' text", name: "bipText", widget: "text", hint: "The paragraph inside the build-in-public box." }
          - label: "Social channel chips"
            name: "soonChips"
            label_singular: "chip"
            widget: "list"
            hint: "The small pills for social channels that are coming soon."
            field: { label: "Chip text", name: "chip", widget: "string" }
          - label: "Launch-notify sign-up"
            name: "notify"
            widget: "object"
            hint: "The one-box e-mail sign-up inside the build-in-public box. Netlify Forms stores the addresses."
            fields:
              - { label: "E-mail box label (screen readers)", name: "label", widget: "string", hint: "Not shown on screen; read aloud by screen readers for the e-mail box." }
              - { label: "E-mail box placeholder", name: "placeholder", widget: "string", hint: "Grey example text inside the empty box, e.g. you@email.com." }
              - { label: "Button label", name: "button", widget: "string", hint: "The text on the sign-up button." }
              - { label: "Success message", name: "success", widget: "text", hint: "Replaces the sign-up box once the address has been sent." }
              - { label: "Fallback e-mail subject", name: "mailtoSubject", widget: "string", hint: "If sending fails, the visitor's own e-mail app opens with this subject line." }

      - name: "faq"
        label: "❓ FAQ"
        file: "src/_data/faq.json"
        preview_path: "/"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string", hint: "The small label above the FAQ heading." }
          - { label: "Heading", name: "title", widget: "string", hint: "The big heading above the list of questions." }
          - label: "Questions"
            name: "items"
            label_singular: "question"
            widget: "list"
            summary: "{{fields.q}}"
            collapsed: true
            hint: "The expandable questions, top to bottom. The same questions and answers are also given to Google as an FAQ."
            fields:
              - { label: "Question", name: "q", widget: "string", hint: "The line visitors click to open the answer." }
              - { label: "Answer", name: "a", widget: "text", hint: "Shown when the question is opened. Plain text only." }

  # ---------------------------------------------------------------
  # Editor-created pages: assembled from configurable blocks.
  # ---------------------------------------------------------------
  - name: "pages"
    label: "📄 Pages (add your own)"
    label_singular: "Page"
    folder: "src/pages"
    create: true
    slug: "{{slug}}"
    preview_path: "{{fields.permalink}}"
    editor:
      preview: true
    fields:
      - { label: "Page title", name: "title", widget: "string" }
      - { label: "URL path", name: "permalink", widget: "string", hint: "Where the page will live, e.g. /about/ — lowercase, wrapped in slashes", pattern: ["^/[a-z0-9-]+/$", "Must look like /about/ — lowercase letters, numbers or dashes, wrapped in slashes"] }
      - { label: "Search description", name: "description", widget: "string", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "page.njk" }
      - label: "Page sections"
        name: "sections"
        widget: "list"
        summary: "{{fields.heading}}{{fields.title}}"
        types:
          - label: "🏠 Big heading (top of page)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Heading — highlighted part", name: "accent", widget: "string", required: false, hint: "The second part of the heading, drawn with a highlighter-style underline (in the soft-fill colour from “Colours & theme”). Leave empty for a plain heading." }
              - { label: "Subtitle", name: "sub", widget: "text", required: false }
              - { label: "Button text", name: "ctaText", widget: "string", required: false }
              - { label: "Button link", name: "ctaLink", widget: "string", required: false, pattern: ["^(/(?!/)\\S*|#\\S+|https?://\\S+|mailto:\\S+)$", "Start with / for a page on this site (e.g. /about/), /#faq for a section of the homepage, # for a spot on the same page, https:// for another website, or mailto: for an email link. An address like www.example.com must start with https://."], hint: "Where the button goes. Type / for a page on this site (e.g. /about/), /#faq for a section of the homepage, #faq for a spot on the same page, https:// (or http://) for another website, or mailto: for an email link. The box refuses anything else, because an address such as www.example.com or about would quietly turn into a link to the homepage. The button only appears when it has text; if you leave this empty it links to the homepage." }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "📝 Text section"
            name: "text"
            widget: "object"
            fields:
              - { label: "Small label above heading", name: "kicker", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "markdown" }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "🖼️ Image + text"
            name: "imageText"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image", choose_url: false, pattern: ["^[A-Za-z0-9._-]+\\.([jJ][pP][eE]?[gG]|[pP][nN][gG]|[wW][eE][bB][pP]|[gG][iI][fF]|[aA][vV][iI][fF]|[sS][vV][gG])$", "Pick or upload a picture (.jpg, .png, .webp, .gif, .avif or .svg). The file name may only use letters, numbers, dots, dashes and underscores."], hint: "The picture shown beside the text. Upload a picture or pick one from the library — web addresses are not accepted." }
              - { label: "Image description (accessibility)", name: "alt", widget: "string" }
              - { label: "Caption under image", name: "caption", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "markdown" }
              - { label: "Image on the right?", name: "imageRight", widget: "boolean", default: false }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "🔢 Number cards"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "Cards"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Big number (e.g. 11% or 20+)", name: "number", widget: "string" }
                  - { label: "Label underneath", name: "label", widget: "string" }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "📣 Big call-to-action banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "Button text", name: "buttonText", widget: "string", required: false }
              - { label: "Button link", name: "buttonLink", widget: "string", required: false, pattern: ["^(/(?!/)\\S*|#\\S+|https?://\\S+|mailto:\\S+)$", "Start with / for a page on this site (e.g. /about/), /#faq for a section of the homepage, # for a spot on the same page, https:// for another website, or mailto: for an email link. An address like www.example.com must start with https://."], hint: "Where the button goes. Type / for a page on this site (e.g. /about/), /#faq for a section of the homepage, #faq for a spot on the same page, https:// (or http://) for another website, or mailto: for an email link. The box refuses anything else, because an address such as www.example.com or about would quietly turn into a link to the homepage. The button only appears when it has text; if you leave this empty it links to the homepage." }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "❓ Questions & answers"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "Questions"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }

  # ---------------------------------------------------------------
  # Direct channel to Claude: publishing an entry commits it to the
  # repo, where Claude reads and actions it.
  # ---------------------------------------------------------------
  - name: "requests"
    label: "🤖 Ask Claude (change requests)"
    label_singular: "request"
    folder: "requests"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "What do you want changed?", name: "title", widget: "string" }
      - { label: "Details — the more specific, the better", name: "body", widget: "markdown" }
      - { label: "Which page or section?", name: "where", widget: "string", required: false }
      - { label: "How urgent?", name: "priority", widget: "select", options: ["Whenever", "This week", "ASAP"], default: "Whenever" }
      - { label: "Status (Claude updates this)", name: "status", widget: "select", options: ["New", "In progress", "Done"], default: "New" }

