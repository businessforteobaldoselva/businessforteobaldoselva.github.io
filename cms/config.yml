backend:
  name: git-gateway
  branch: main

# Enables editing against the local repo when `npm run cms-local` is running
# (ignored in production — it only activates if the local proxy is detected).
local_backend: true

media_folder: "images"
public_folder: "/images"

site_url: https://coveredaccess.netlify.app
display_url: https://coveredaccess.netlify.app
logo_url: /images/covered-logo.svg

locale: "en"

collections:
  - name: "content"
    label: "✏️ Website Content"
    files:
      - name: "site"
        label: "⚙️ Site-wide (title, contact, CTA)"
        file: "src/_data/site.json"
        fields:
          - { label: "Page title (browser tab)", name: "pageTitle", widget: "string" }
          - { label: "Meta description (search engines)", name: "metaDescription", widget: "text" }
          - { label: "Social share description", name: "ogDescription", widget: "text" }
          - { label: "Contact email", name: "contactEmail", widget: "string" }
          - { label: "Browser-tab title on other pages (About, Privacy…)", name: "subpageTitle", widget: "string", hint: "The title shown in the browser tab and in social shares for every page except the homepage. Write {title} where the page's own title should go, e.g. {title} — COVERED." }
          - { label: "Social share picture", name: "shareImage", widget: "image", hint: "The picture that appears when the site is shared on WhatsApp, LinkedIn and similar apps, and the logo picture search engines use. Best size is 1200 × 630 pixels." }
          - { label: "Updates feed name", name: "feedTitle", widget: "string", hint: "The name news-reader apps show for the site's updates feed. Not visible on the pages themselves." }
          - { label: "Search-engine tagline", name: "schemaSlogan", widget: "string", hint: "A one-line slogan for COVERED that search engines and AI assistants read. Not visible on the pages themselves." }
          - { label: "Search-engine description of COVERED", name: "schemaDescription", widget: "text", hint: "A short factual description of what COVERED is, read by search engines and AI assistants. Not visible on the pages themselves." }
          - { label: "Search-engine location", name: "schemaPlace", widget: "string", hint: "Where COVERED was founded, e.g. Exeter, United Kingdom. Read by search engines and AI assistants; not visible on the pages themselves." }
          - { label: "Closing banner — heading", name: "ctaBannerTitle", widget: "string" }
          - { label: "Closing banner — text", name: "ctaBannerText", widget: "text" }
          - { label: "Closing banner — button label", name: "ctaBannerButton", widget: "string" }

      - name: "nav"
        label: "🧭 Navigation menu (top bar)"
        file: "src/_data/nav.json"
        fields:
          - { label: "Skip link text", name: "skipLink", widget: "string", hint: "A hidden link that appears when someone presses Tab on any page. It lets keyboard and screen-reader users jump straight past the menu to the content." }
          - { label: "Logo link — screen-reader label", name: "homeLabel", widget: "string", hint: "Read aloud by screen readers for the COVERED logo in the top bar and footer. Not visible on the page." }
          - { label: "Mobile menu button — screen-reader label", name: "menuLabel", widget: "string", hint: "Read aloud for the three-line menu button on phones. Not visible on the page." }
          - { label: "“Back” button text (About, Privacy and other pages)", name: "backLabel", widget: "string", hint: "The button at the right of the top bar on every page except the homepage. It links back to the homepage." }
          - label: "Menu links"
            name: "items"
            widget: "list"
            label_singular: "menu link"
            collapsed: false
            min: 1
            max: 8
            summary: "{{fields.label}}"
            hint: "The links in the top bar of the homepage, left to right (on phones they appear in the menu that opens from the three-line button). Drag to reorder, add or delete links. Keep it to 8 or fewer so the bar fits. A link to a homepage section disappears by itself while that section is hidden in “Page layout”."
            types:
              - label: "⚓ Jump to a homepage section"
                name: "section"
                widget: "object"
                summary: "{{fields.label}} — jumps to a section"
                fields:
                  - { label: "Link text", name: "label", widget: "string", hint: "The words shown in the top bar." }
                  - label: "Which section"
                    name: "section"
                    widget: "select"
                    options:
                      - { label: "The problem", value: "problem" }
                      - { label: "How it works", value: "how" }
                      - { label: "For brands", value: "brands" }
                      - { label: "Partner wall", value: "partners" }
                      - { label: "For venues", value: "venues" }
                      - { label: "Locations", value: "locations" }
                      - { label: "FAQ", value: "faq" }
                  - { label: "Show as a highlighted button", name: "button", widget: "boolean", default: false, required: false, hint: "Turns the link into the orange button, like “Advertise with us”." }
              - label: "🔗 Link to a page or website"
                name: "link"
                widget: "object"
                summary: "{{fields.label}} — {{fields.url}}"
                fields:
                  - { label: "Link text", name: "label", widget: "string", hint: "The words shown in the top bar." }
                  - { label: "Address", name: "url", widget: "string", hint: "A page on this site such as /about/, a section of the homepage such as /#faq, or a full address starting with https://. Anything else is ignored for safety." }
                  - { label: "Show as a highlighted button", name: "button", widget: "boolean", default: false, required: false, hint: "Turns the link into the orange button." }
              - label: "✉️ Email us"
                name: "email"
                widget: "object"
                summary: "{{fields.label}} — emails the contact address"
                fields:
                  - { label: "Link text", name: "label", widget: "string", hint: "Opens an email to the contact address set in “Site-wide”." }
                  - { label: "Show as a highlighted button", name: "button", widget: "boolean", default: false, required: false }

      - name: "footer"
        label: "🦶 Footer (bottom of every page)"
        file: "src/_data/footer.json"
        fields:
          - { label: "Tagline under the logo", name: "tagline", widget: "string", hint: "The short sentence under the COVERED logo in the footer of the homepage." }
          - label: "Link columns"
            name: "columns"
            widget: "list"
            label_singular: "column"
            collapsed: true
            max: 4
            summary: "{{fields.heading}}"
            hint: "The columns of links in the footer of the homepage (currently “Explore” and “Partner”). Drag to reorder, add or delete columns."
            fields:
              - { label: "Column heading", name: "heading", widget: "string", hint: "The small capitals heading above the links." }
              - { label: "Screen-reader label", name: "ariaLabel", widget: "string", required: false, hint: "Read aloud by screen readers to describe this group of links, e.g. “Footer — explore”. Not visible. If left empty the column heading is used." }
              - label: "Links"
                name: "links"
                widget: "list"
                label_singular: "link"
                collapsed: false
                max: 12
                summary: "{{fields.label}}"
                hint: "A link to a homepage section disappears by itself while that section is hidden in “Page layout”."
                types:
                  - label: "⚓ Jump to a homepage section"
                    name: "section"
                    widget: "object"
                    summary: "{{fields.label}} — jumps to a section"
                    fields:
                      - { label: "Link text", name: "label", widget: "string" }
                      - label: "Which section"
                        name: "section"
                        widget: "select"
                        options:
                          - { label: "The problem", value: "problem" }
                          - { label: "How it works", value: "how" }
                          - { label: "For brands", value: "brands" }
                          - { label: "Partner wall", value: "partners" }
                          - { label: "For venues", value: "venues" }
                          - { label: "Locations", value: "locations" }
                          - { label: "FAQ", value: "faq" }
                  - label: "🔗 Link to a page or website"
                    name: "link"
                    widget: "object"
                    summary: "{{fields.label}} — {{fields.url}}"
                    fields:
                      - { label: "Link text", name: "label", widget: "string" }
                      - { label: "Address", name: "url", widget: "string", hint: "A page on this site such as /privacy/, a section of the homepage such as /#faq, or a full address starting with https://. Anything else is ignored for safety." }
                  - label: "✉️ Email us"
                    name: "email"
                    widget: "object"
                    summary: "{{fields.label}} — emails the contact address"
                    fields:
                      - { label: "Link text", name: "label", widget: "string", hint: "Opens an email to the contact address set in “Site-wide”." }
          - { label: "Copyright line", name: "copyright", widget: "string", hint: "Bottom-left of the footer. Write {year} where the current year should appear — it updates itself every January. (Pages other than the homepage show the line without the year.)" }
          - { label: "“Last updated” label", name: "updatedLabel", widget: "string", hint: "The words before the date in the footer, e.g. “Last updated:”." }
          - { label: "Last updated date", name: "lastUpdated", widget: "string", required: false, hint: "Shown after the label in the footer of the homepage. Leave empty to hide the whole “Last updated” line." }
          - { label: "Sign-off message", name: "signOff", widget: "string", required: false, hint: "The handwritten-style message at the bottom of the homepage footer." }
          - { label: "Sign-off emoji", name: "signOffEmoji", widget: "string", required: false, hint: "A single emoji shown after the sign-off message. Decorative only." }
          - label: "Short footer links (About, Privacy and other pages)"
            name: "compactLinks"
            widget: "list"
            label_singular: "link"
            collapsed: true
            max: 6
            summary: "{{fields.label}}"
            hint: "Every page except the homepage has a slim footer: the copyright line plus these links, separated by dots."
            types:
              - label: "🔗 Link to a page or website"
                name: "link"
                widget: "object"
                summary: "{{fields.label}} — {{fields.url}}"
                fields:
                  - { label: "Link text", name: "label", widget: "string" }
                  - { label: "Address", name: "url", widget: "string", hint: "A page on this site such as /privacy/, or a full address starting with https://. Anything else is ignored for safety." }
              - label: "✉️ Email us"
                name: "email"
                widget: "object"
                summary: "{{fields.label}} — emails the contact address"
                fields:
                  - { label: "Link text", name: "label", widget: "string", hint: "Opens an email to the contact address set in “Site-wide”." }

      - name: "homepage"
        label: "🧩 Page layout — order, add & hide sections"
        file: "src/_data/homepage.json"
        fields:
          - label: "Homepage sections"
            name: "sections"
            label_singular: "section"
            widget: "list"
            hint: "This is the running order of the homepage, top to bottom. Drag sections to reorder the page, untick “Show this section” to hide one without deleting it, and use the add button to drop in your own text, image, number, banner or Q&A blocks. Each built-in section (hero, ticker, FAQ…) should appear only once — if one is added twice, only the first copy is shown on the site. Your own blocks can repeat freely."
            types:
              - label: "🏠 Hero (big opening screen)"
                name: "hero"
                widget: "object"
                summary: "Hero — headline, stamp and buttons"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true, hint: "The hero holds the page's main heading. If you hide it, an invisible fallback heading (the site title) is used so search engines and screen readers still find one — but the page will open more abruptly." }
              - label: "🎞️ Scrolling venue ticker"
                name: "marquee"
                widget: "object"
                summary: "Ticker — the moving strip of venue names"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - label: "Ticker words"
                    name: "items"
                    widget: "list"
                    required: false
                    field: { label: "Word or phrase", name: "item", widget: "string" }
                    hint: "The words that scroll across the moving strip under the hero (Universities, Train stations, Stadiums…), in this order. If you empty the list the strip disappears — to hide it deliberately, untick “Show this section” instead."
                  - { label: "Pause button — screen-reader label", name: "pauseLabel", widget: "string", hint: "Not visible on the page. Read aloud by screen readers for the small pause (⏸) button at the left end of the ticker." }
                  - { label: "Hidden sentence — start", name: "screenReaderIntro", widget: "string", required: false, hint: "Not visible on the page. The ticker is hidden from screen readers, so they read one sentence instead: this start, then your ticker words in lowercase, then the ending. Example: “Target venues include universities, train stations and schools.”" }
                  - { label: "Hidden sentence — word before the last item", name: "screenReaderJoiner", widget: "string", required: false, hint: "Usually “and”. Placed between the second-to-last and last ticker word in the hidden sentence." }
                  - { label: "Hidden sentence — ending", name: "screenReaderEnd", widget: "string", required: false, hint: "Usually a full stop. Added after the last ticker word in the hidden sentence." }
              - label: "📊 The problem (stats & photos)"
                name: "problem"
                widget: "object"
                summary: "The problem — statistics and photo strip"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🔁 The model (Brands pay. You don't.)"
                name: "model"
                widget: "object"
                summary: "The model — how the funding loop works"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "📱 How it works (interactive demo)"
                name: "how"
                widget: "object"
                summary: "How it works — the tap-through machine demo"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "📣 For brands (advertising enquiry)"
                name: "brands"
                widget: "object"
                summary: "For brands — benefits and enquiry form"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🤝 Partner wall"
                name: "partners"
                widget: "object"
                summary: "Partner wall — the reserved logo slots"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🏟️ For venues (hosting enquiry)"
                name: "venues"
                widget: "object"
                summary: "For venues — what we handle and the venue form"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🗺️ Locations (UK map)"
                name: "locations"
                widget: "object"
                summary: "Locations — the UK map and city chips"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🚀 Vision / roadmap"
                name: "vision"
                widget: "object"
                summary: "Vision — milestones and launch-notify form"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "❓ FAQ"
                name: "faq"
                widget: "object"
                summary: "FAQ — the questions accordion"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "✉️ Closing banner (get in touch)"
                name: "cta"
                widget: "object"
                summary: "Closing banner — the big sign-off with email button"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true, hint: "The banner’s heading, text and button label are edited under “Site-wide (title, contact, CTA)”; the fields below are the small extras." }
                  - { label: "Section name — screen-reader label", name: "ariaLabel", widget: "string", hint: "Not visible on the page. Read aloud by screen readers when they reach the closing section (brand animation + banner)." }
                  - { label: "Brand animation — description (accessibility)", name: "videoLabel", widget: "text", hint: "Not visible on the page. Describes the “covered.” animation above the banner for screen-reader users and anyone who can’t see the video." }
                  - { label: "Email subject line", name: "emailSubject", widget: "string", required: false, hint: "The subject that is pre-filled when someone clicks the banner button and their email app opens. The address itself is the contact email under “Site-wide”. Leave empty for no pre-filled subject." }
              - label: "📝 Text section (add your own)"
                name: "textBlock"
                widget: "object"
                summary: "Your text — {{fields.heading}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Small label above heading", name: "kicker", widget: "string", required: false }
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - { label: "Text", name: "body", widget: "markdown" }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets /#our-story scroll straight to it." }
              - label: "🖼️ Image + text (add your own)"
                name: "imageTextBlock"
                widget: "object"
                summary: "Your image + text — {{fields.heading}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Image description (accessibility)", name: "alt", widget: "string" }
                  - { label: "Caption under image", name: "caption", widget: "string", required: false }
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - { label: "Text", name: "body", widget: "markdown" }
                  - { label: "Image on the right?", name: "imageRight", widget: "boolean", default: false }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets /#our-story scroll straight to it." }
              - label: "🔢 Number cards (add your own)"
                name: "statsBlock"
                widget: "object"
                summary: "Your number cards — {{fields.heading}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - label: "Cards"
                    name: "items"
                    widget: "list"
                    fields:
                      - { label: "Big number (e.g. 11% or 20+)", name: "number", widget: "string" }
                      - { label: "Label underneath", name: "label", widget: "string" }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-numbers"], hint: "Gives this block its own link — the anchor “our-numbers” lets /#our-numbers scroll straight to it." }
              - label: "📣 Big orange banner (add your own)"
                name: "bannerBlock"
                widget: "object"
                summary: "Your banner — {{fields.title}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", required: false }
                  - { label: "Button text", name: "buttonText", widget: "string", required: false }
                  - { label: "Button link", name: "buttonLink", widget: "string", required: false }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. join-us"], hint: "Gives this block its own link — the anchor “join-us” lets /#join-us scroll straight to it." }
              - label: "❓ Questions & answers (add your own)"
                name: "faqBlock"
                widget: "object"
                summary: "Your Q&A — {{fields.heading}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - label: "Questions"
                    name: "items"
                    widget: "list"
                    fields:
                      - { label: "Question", name: "q", widget: "string" }
                      - { label: "Answer", name: "a", widget: "text" }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. more-questions"], hint: "Gives this block its own link — the anchor “more-questions” lets /#more-questions scroll straight to it." }

      - name: "theme"
        label: "🎨 Colours & theme"
        file: "src/_data/theme.json"
        fields:
          - label: "Backgrounds — page background"
            name: "paper"
            widget: "color"
            allowInput: true
            required: false
            hint: "The main canvas behind the whole site (light lavender). Note — the COVERED logo colours are part of the logo artwork and cannot be changed here. When changing any colour, keep text/background contrast at least 4.5:1 (webaim.org/resources/contrastchecker). Clearing a colour restores its default."
          - label: "Backgrounds — cards & inputs tint"
            name: "paper2"
            widget: "color"
            allowInput: true
            required: false
            hint: "Slightly deeper tint for alternate panels and form fields. Also colours the browser bar on mobile — and the keyboard focus ring on the dark violet sections, the footer and the closing banner, so keep it light (at least 3:1 contrast against the violet)."
          - label: "Backgrounds — partner wall band (grass)"
            name: "bandGrass"
            widget: "color"
            allowInput: true
            required: false
            hint: "Light grass background behind the partner wall."
          - label: "Backgrounds — hero band (lavender)"
            name: "bandLav"
            widget: "color"
            allowInput: true
            required: false
            hint: "Light lavender background behind the opening screen."
          - label: "Backgrounds — how-it-works band (warm)"
            name: "bandRosa"
            widget: "color"
            allowInput: true
            required: false
            hint: "Light warm background behind the interactive demo."
          - label: "Backgrounds — hover tint on dark sections"
            name: "peach"
            widget: "color"
            allowInput: true
            required: false
            hint: "Light orange used for link/button hovers on dark violet sections."
          - label: "Body text / dark sections (violet)"
            name: "ink"
            widget: "color"
            allowInput: true
            required: false
            hint: "The main text colour — also fills the dark violet sections, and tints hairlines and card shadows. Keep it dark: it must read clearly on the page background (at least 4.5:1 contrast)."
          - label: "Footer & deep headings (darker violet)"
            name: "inkDeep"
            widget: "color"
            allowInput: true
            required: false
            hint: "Deeper violet for the footer background and heading depth. Also the keyboard focus ring on the lavender and grass bands (the model, vision and ticker strips), so keep it dark (at least 3:1 contrast against those bands)."
          - label: "Subheadings (softer violet)"
            name: "inkSoft"
            widget: "color"
            allowInput: true
            required: false
            hint: "Softer violet used for subheadings."
          - label: "Secondary text (muted mauve)"
            name: "muted"
            widget: "color"
            allowInput: true
            required: false
            hint: "Quieter text such as captions and small print — keep at least 4.5:1 contrast on the page background."
          - label: "Buttons & accents (orange)"
            name: "accent"
            widget: "color"
            allowInput: true
            required: false
            hint: "The primary accent — CTA button fill, highlights and confetti."
          - label: "Buttons with white text (deep orange)"
            name: "accentDeep"
            widget: "color"
            allowInput: true
            required: false
            hint: "Deeper accent used where white text sits on top — keep it dark enough for the white text to stay readable."
          - label: "Accent text on light backgrounds (dark orange)"
            name: "accentDark"
            widget: "color"
            allowInput: true
            required: false
            hint: "Darkest accent — used for accent-coloured text and focus outlines on light backgrounds (needs strong contrast)."
          - label: "Small kicker labels (dark orange)"
            name: "kickerBand"
            widget: "color"
            allowInput: true
            required: false
            hint: "The little uppercase labels above section headings."
          - label: "Decorative dots & ticker band (grass)"
            name: "grass"
            widget: "color"
            allowInput: true
            required: false
            hint: "Grass accent — decorative dots, the scrolling ticker band and confetti. Keyboard focus rings on the ticker band are drawn in the deep violet, so keep this light enough for them to stay visible."
          - label: "Grass text on light backgrounds (dark grass)"
            name: "grassDark"
            widget: "color"
            allowInput: true
            required: false
            hint: "Darker grass used for grass-coloured text on light backgrounds."
          - label: "Pills & soft fills (lavender)"
            name: "lavender"
            widget: "color"
            allowInput: true
            required: false
            hint: "Lavender accent — pills, the model band background and soft highlights. Keyboard focus rings on the model and vision bands are drawn in the deep violet, so keep this light enough for them to stay visible."

      - name: "motion"
        label: "🎬 Animations"
        file: "src/_data/motion.json"
        fields:
          - label: "Animations on/off"
            name: "enabled"
            widget: "boolean"
            default: true
            hint: "Master switch — turn ALL moving effects on/off. Off means nothing moves: everything simply appears in place, exactly as visitors who ask their device for less motion already see it."
          - label: "Overall speed"
            name: "speed"
            widget: "select"
            options:
              - { label: "Slower — calm and gentle", value: "slower" }
              - { label: "Normal — as designed", value: "normal" }
              - { label: "Faster — quick and snappy", value: "faster" }
            default: "normal"
            hint: "How quickly things move — the scrolling ticker, floating decorations, drop-in effects and so on."
          - label: "How sections appear when you scroll"
            name: "reveal"
            widget: "select"
            options:
              - { label: "Rise into place", value: "rise" }
              - { label: "Fade in", value: "fade" }
              - { label: "Off — just appear", value: "off" }
            default: "rise"
            hint: "The little entrance each section makes as it scrolls into view."
          - label: "Opening headline entrance"
            name: "heroIntro"
            widget: "boolean"
            default: true
            hint: "The big headline rising word by word and the stamp slamming down when the page first loads. Off shows them straight away."
          - label: "Floating decorations"
            name: "floatingHearts"
            widget: "boolean"
            default: true
            hint: "The hearts and product packs gently bobbing around the opening screen. Off keeps them visible but still."
          - label: "Scrolling venue ticker"
            name: "marquee"
            widget: "boolean"
            default: true
            hint: "Whether the strip of venue names glides along by itself. Off keeps the strip on the page but still."
          - label: "Counting numbers"
            name: "counters"
            widget: "boolean"
            default: true
            hint: "The statistics counting up from zero as they come into view. Off shows the final numbers immediately."
          - label: "Production line"
            name: "conveyor"
            widget: "boolean"
            default: true
            hint: "The conveyor belt of product packs rolling across the roadmap section. Off keeps the packs visible but still."
          - label: "Map pins dropping in"
            name: "mapPinDrop"
            widget: "boolean"
            default: true
            hint: "The city pins bouncing onto the UK map when it scrolls into view. Off shows the pins straight away."
          - label: "Confetti"
            name: "confetti"
            widget: "boolean"
            default: true
            hint: "The little burst of confetti when the demo dispenses a pack and when the map pins land."
          - label: "Reading progress bar"
            name: "scrollProgress"
            widget: "boolean"
            default: true
            hint: "The thin orange line along the very top of the page that fills up as you scroll."

      - name: "hero"
        label: "🏠 Hero (top of page)"
        file: "src/_data/hero.json"
        fields:
          - { label: "Badge text", name: "badge", widget: "string", hint: "The small pill with the pulsing dot above the headline." }
          - { label: "Headline — main part", name: "headlineMain", widget: "string", hint: "The big page heading. It runs straight on into the accent part below, on the same line." }
          - { label: "Headline — accent part (red)", name: "headlineAccent", widget: "string", hint: "The coloured second half of the big page heading." }
          - { label: "Stamp text", name: "stamp", widget: "string", hint: "The ink-stamp that slams down under the headline as the dispenser animation finishes." }
          - { label: "Subheading", name: "subhead", widget: "text", hint: "The paragraph under the stamp." }
          - { label: "Button — brand CTA", name: "ctaBrand", widget: "string", hint: "Solid button that jumps to the “For brands” section. Only shown while that section is switched on." }
          - { label: "Button — venue CTA", name: "ctaVenue", widget: "string", hint: "Outlined button that jumps to the “For venues” section. Only shown while that section is switched on." }
          - { label: "Scroll-down link text", name: "scrollText", widget: "string", hint: "Small link under the buttons that jumps to the “problem” section. Only shown while that section is switched on." }
          - { label: "Section name — screen-reader label", name: "sectionLabel", widget: "string", hint: "Not visible on the page. Read aloud by screen readers when they reach the hero (the opening screen)." }

      - name: "problem"
        label: "📊 The Problem section"
        file: "src/_data/problem.json"
        fields:
          - { label: "Kicker (small label above heading)", name: "kicker", widget: "string" }
          - { label: "Heading (line breaks allowed, e.g. <br />)", name: "title", widget: "string" }
          - { label: "Subheading", name: "subtitle", widget: "text" }
          - { label: "Manifesto (lights up word by word as visitors scroll; wrap a word in *stars* to turn it orange)", name: "manifesto", widget: "text", required: false }
          - label: "Statistics"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Number (%)", name: "number", widget: "number" }
              - { label: "Label text", name: "label", widget: "text" }
          - { label: "Source citation text", name: "sourceText", widget: "string" }
          - { label: "Source URL", name: "sourceUrl", widget: "string" }
          - label: "Photos"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Image path", name: "src", widget: "hidden" }
              - { label: "Width", name: "width", widget: "hidden" }
              - { label: "Height", name: "height", widget: "hidden" }
              - { label: "Rotation", name: "tilt", widget: "hidden" }
              - { label: "Alt text (accessibility)", name: "alt", widget: "text" }
              - { label: "Caption", name: "caption", widget: "string" }

      - name: "model"
        label: "🔁 The Model (Brands pay. You don't.)"
        file: "src/_data/model.json"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string" }
          - { label: "Heading", name: "title", widget: "string" }
          - { label: "Subheading", name: "subtitle", widget: "text" }
          - label: "Steps"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

      - name: "how"
        label: "📱 How It Works (demo section text)"
        file: "src/_data/how.json"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string" }
          - { label: "Heading", name: "title", widget: "string" }
          - { label: "Subheading", name: "subtitle", widget: "text" }
          - { label: "Note below the demo", name: "demoNote", widget: "text" }
          - label: "Story strip (four photo moments above the demo)"
            name: "story"
            widget: "list"
            required: false
            hint: "Leave empty to hide the strip. Titles ending in a full stop get the orange brand period automatically."
            fields:
              - { label: "Image path (without extension)", name: "img", widget: "hidden" }
              - { label: "Image width", name: "w", widget: "hidden" }
              - { label: "Image height", name: "h", widget: "hidden" }
              - { label: "Title (e.g. Spot it.)", name: "title", widget: "string" }
              - { label: "Caption", name: "caption", widget: "string" }
              - { label: "Alt text (describes the image for screen readers)", name: "alt", widget: "string" }

      - name: "brands"
        label: "📣 For Brands section"
        file: "src/_data/brands.json"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string" }
          - { label: "Heading (line breaks allowed, e.g. <br />)", name: "title", widget: "string" }
          - { label: "Subheading", name: "subtitle", widget: "text" }
          - label: "Header photo"
            name: "headerPhoto"
            widget: "object"
            fields:
              - { label: "Image path", name: "src", widget: "hidden" }
              - { label: "Width", name: "width", widget: "hidden" }
              - { label: "Height", name: "height", widget: "hidden" }
              - { label: "Alt text (accessibility)", name: "alt", widget: "text" }
              - { label: "Caption", name: "caption", widget: "string" }
          - label: "Benefits"
            name: "benefits"
            widget: "list"
            fields:
              - { label: "Icon (emoji)", name: "icon", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Chips"
            name: "chips"
            widget: "list"
            field: { label: "Chip text", name: "chip", widget: "string" }
          - { label: "Form heading", name: "formHeading", widget: "string" }
          - { label: "Form button label", name: "formButton", widget: "string" }
          - { label: "Form hint text", name: "formHint", widget: "string" }

      - name: "partners"
        label: "🤝 Partners wall"
        file: "src/_data/partners.json"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string" }
          - { label: "Heading (line breaks allowed, e.g. <br />)", name: "title", widget: "string" }
          - { label: "Subheading", name: "subtitle", widget: "text" }
          - label: "Partner slots"
            name: "slots"
            widget: "list"
            fields:
              - { label: "Founding-partner slot?", name: "founding", widget: "boolean", default: false }
              - { label: "Logo text / brand name", name: "logoText", widget: "string" }
              - { label: "Category label", name: "category", widget: "string" }
          - { label: "Button label", name: "ctaButton", widget: "string" }

      - name: "venues"
        label: "🏟️ For Venues section"
        file: "src/_data/venues.json"
        fields:
          - { label: "Pilot ribbon text", name: "ribbon", widget: "string" }
          - { label: "Kicker", name: "kicker", widget: "string" }
          - { label: "Heading (line breaks allowed, e.g. <br />)", name: "title", widget: "string" }
          - { label: "Subheading", name: "subtitle", widget: "text" }
          - label: "We handle (list)"
            name: "weHandle"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - label: "You provide (list)"
            name: "youProvide"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - { label: "Form heading", name: "formHeading", widget: "string" }
          - { label: "Form button label", name: "formButton", widget: "string" }
          - { label: "Form hint text", name: "formHint", widget: "string" }

      - name: "locations"
        label: "🗺️ Locations / UK map"
        file: "src/_data/locations.json"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string" }
          - { label: "Heading (line breaks allowed, e.g. <br />)", name: "title", widget: "string" }
          - { label: "Subheading", name: "subtitle", widget: "text" }
          - { label: "Map viewBox (do not edit)", name: "svgViewBox", widget: "hidden" }
          - { label: "Map alt text (do not edit)", name: "svgAriaLabel", widget: "hidden" }
          - { label: "Map geometry — neighbours (do not edit)", name: "neighborPath", widget: "hidden" }
          - { label: "Map geometry — UK (do not edit)", name: "landPath", widget: "hidden" }
          - label: "Cities"
            name: "cities"
            widget: "list"
            fields:
              - { label: "ID (do not edit)", name: "id", widget: "hidden" }
              - { label: "City name", name: "name", widget: "string" }
              - { label: "Map X position (do not edit)", name: "x", widget: "hidden" }
              - { label: "Map Y position (do not edit)", name: "y", widget: "hidden" }
              - { label: "Is this the live pilot city?", name: "live", widget: "boolean", default: false }
              - { label: "Description shown when selected", name: "blurb", widget: "text" }
          - label: "Venue types targeted"
            name: "placeTypes"
            widget: "list"
            fields:
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - { label: "Button label", name: "ctaButton", widget: "string" }

      - name: "vision"
        label: "🚀 Vision / roadmap"
        file: "src/_data/vision.json"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string" }
          - { label: "Heading (line breaks allowed, e.g. <br />)", name: "title", widget: "string" }
          - label: "Milestones"
            name: "milestones"
            widget: "list"
            fields:
              - { label: "Phase tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - { label: "'Build in public' heading", name: "bipTitle", widget: "string" }
          - { label: "'Build in public' text", name: "bipText", widget: "text" }
          - label: "Social channel chips"
            name: "soonChips"
            widget: "list"
            field: { label: "Chip text", name: "chip", widget: "string" }

      - name: "faq"
        label: "❓ FAQ"
        file: "src/_data/faq.json"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string", hint: "The small label above the FAQ heading." }
          - { label: "Heading", name: "title", widget: "string", hint: "The big heading above the list of questions." }
          - label: "Questions"
            name: "items"
            label_singular: "question"
            widget: "list"
            summary: "{{fields.q}}"
            collapsed: true
            hint: "The expandable questions, top to bottom. The same questions and answers are also given to Google as an FAQ."
            fields:
              - { label: "Question", name: "q", widget: "string", hint: "The line visitors click to open the answer." }
              - { label: "Answer", name: "a", widget: "text", hint: "Shown when the question is opened. Plain text only." }

  # ---------------------------------------------------------------
  # Editor-created pages: assembled from configurable blocks.
  # ---------------------------------------------------------------
  - name: "pages"
    label: "📄 Pages (add your own)"
    label_singular: "Page"
    folder: "src/pages"
    create: true
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Page title", name: "title", widget: "string" }
      - { label: "URL path", name: "permalink", widget: "string", hint: "Where the page will live, e.g. /about/ — lowercase, wrapped in slashes", pattern: ["^/[a-z0-9-]+/$", "Must look like /about/ — lowercase letters, numbers or dashes, wrapped in slashes"] }
      - { label: "Search description", name: "description", widget: "string", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "page.njk" }
      - label: "Page sections"
        name: "sections"
        widget: "list"
        summary: "{{fields.heading}}{{fields.title}}"
        types:
          - label: "🏠 Big heading (top of page)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Heading — orange part", name: "accent", widget: "string", required: false }
              - { label: "Subtitle", name: "sub", widget: "text", required: false }
              - { label: "Button text", name: "ctaText", widget: "string", required: false }
              - { label: "Button link", name: "ctaLink", widget: "string", required: false, hint: "e.g. /#brands or /about/" }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "📝 Text section"
            name: "text"
            widget: "object"
            fields:
              - { label: "Small label above heading", name: "kicker", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "markdown" }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "🖼️ Image + text"
            name: "imageText"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image description (accessibility)", name: "alt", widget: "string" }
              - { label: "Caption under image", name: "caption", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "markdown" }
              - { label: "Image on the right?", name: "imageRight", widget: "boolean", default: false }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "🔢 Number cards"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "Cards"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Big number (e.g. 11% or 20+)", name: "number", widget: "string" }
                  - { label: "Label underneath", name: "label", widget: "string" }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "📣 Big orange banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "Button text", name: "buttonText", widget: "string", required: false }
              - { label: "Button link", name: "buttonLink", widget: "string", required: false }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }
          - label: "❓ Questions & answers"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "Questions"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }
              - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(top|progress|year|pack|stepper|problem|model|how|brands|partners|venues|locations|vision|faq)(-title)?$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets visitors open this page at …/#our-story and land straight on it." }

  # ---------------------------------------------------------------
  # Direct channel to Claude: publishing an entry commits it to the
  # repo, where Claude reads and actions it.
  # ---------------------------------------------------------------
  - name: "requests"
    label: "🤖 Ask Claude (change requests)"
    label_singular: "request"
    folder: "requests"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "What do you want changed?", name: "title", widget: "string" }
      - { label: "Details — the more specific, the better", name: "body", widget: "markdown" }
      - { label: "Which page or section?", name: "where", widget: "string", required: false }
      - { label: "How urgent?", name: "priority", widget: "select", options: ["Whenever", "This week", "ASAP"], default: "Whenever" }
      - { label: "Status (Claude updates this)", name: "status", widget: "select", options: ["New", "In progress", "Done"], default: "New" }

