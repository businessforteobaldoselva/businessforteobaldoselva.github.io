backend:
  name: git-gateway
  branch: main

# Every save becomes a draft (a GitHub pull request) that someone must move to Ready and Publish.
# Nothing reaches the live site until it is published; Netlify builds a preview of each draft.
publish_mode: editorial_workflow

# Enables editing against the local repo when `npm run cms-local` is running
# (ignored in production — it only activates if the local proxy is detected).
local_backend: true

media_folder: "images"
public_folder: "/images"

site_url: https://coveredaccess.netlify.app
display_url: https://coveredaccess.netlify.app
logo_url: /images/covered-logo.svg

locale: "en"

collections:
  - name: "content"
    label: "✏️ Website Content"
    files:
      - name: "site"
        label: "⚙️ Site-wide (title, contact, CTA)"
        file: "src/_data/site.json"
        preview_path: "/"
        fields:
          - { label: "Page title (browser tab)", name: "pageTitle", widget: "string" }
          - { label: "Meta description (search engines)", name: "metaDescription", widget: "text" }
          - { label: "Social share description", name: "ogDescription", widget: "text" }
          - { label: "Contact email", name: "contactEmail", widget: "string", pattern: ["^[^\\s@<>]+@[^\\s@<>]+\\.[^\\s@<>]+$", "Enter one email address, like hello@example.com (no spaces)."], hint: "The address people write to. It is used by every “Email us” link in the menu and footer, the closing-banner button, the fallback e-mail that opens when a form cannot be sent, and the contact address search engines read. It is also typed by hand (not linked to this box) in the Privacy page text, the updates feed file (feed.xml) and llms.txt — if you change it here, change it there too." }
          - { label: "Browser-tab title on other pages (About, Privacy…)", name: "subpageTitle", widget: "string", hint: "The title shown in the browser tab and in social shares for every page except the homepage. Write {title} where the page's own title should go, e.g. {title} — COVERED." }
          - { label: "Social share picture", name: "shareImage", widget: "image", choose_url: false, pattern: ["^[A-Za-z0-9._-]+\\.([jJ][pP][eE]?[gG]|[pP][nN][gG]|[wW][eE][bB][pP]|[gG][iI][fF]|[aA][vV][iI][fF]|[sS][vV][gG])$", "Pick or upload a picture (.jpg, .png, .webp, .gif, .avif or .svg). The file name may only use letters, numbers, dots, dashes and underscores."], hint: "The picture that appears when the site is shared on WhatsApp, LinkedIn and similar apps, and the logo picture search engines use. Best size is 1200 × 630 pixels. Upload a picture or pick one from the library — web addresses are not accepted." }
          - { label: "Updates feed name", name: "feedTitle", widget: "string", hint: "The name given to the updates-feed link in every page's hidden header, which news-reader apps may show when they discover the feed from the page. Not visible on the pages themselves. The feed file (feed.xml) has its own title, which this box does not change." }
          - { label: "Search-engine tagline", name: "schemaSlogan", widget: "string", hint: "A one-line slogan for COVERED that search engines and AI assistants read. Not visible on the pages themselves." }
          - { label: "Search-engine description of COVERED", name: "schemaDescription", widget: "text", hint: "A short factual description of what COVERED is, read by search engines and AI assistants. Not visible on the pages themselves." }
          - { label: "Search-engine location", name: "schemaPlace", widget: "string", hint: "Where COVERED was founded, e.g. Exeter, United Kingdom. Read by search engines and AI assistants; not visible on the pages themselves." }
          - { label: "Closing banner — heading", name: "ctaBannerTitle", widget: "string" }
          - { label: "Closing banner — text", name: "ctaBannerText", widget: "text" }
          - { label: "Closing banner — button label", name: "ctaBannerButton", widget: "string" }

      - name: "nav"
        label: "🧭 Navigation menu (top bar)"
        file: "src/_data/nav.json"
        preview_path: "/"
        fields:
          - { label: "Skip link text", name: "skipLink", widget: "string", hint: "A hidden link that appears when someone presses Tab on any page. It lets keyboard and screen-reader users jump straight past the menu to the content." }
          - { label: "Logo link — screen-reader label", name: "homeLabel", widget: "string", hint: "Read aloud by screen readers for the COVERED logo in the top bar and footer. Not visible on the page." }
          - { label: "Mobile menu button — screen-reader label", name: "menuLabel", widget: "string", hint: "Read aloud for the three-line menu button on phones. Not visible on the page." }
          - { label: "“Back” button text (About, Privacy and other pages)", name: "backLabel", widget: "string", hint: "The button at the right of the top bar on every page except the homepage. It links back to the homepage." }
          - label: "Menu links"
            name: "items"
            widget: "list"
            label_singular: "menu link"
            collapsed: false
            min: 1
            max: 8
            summary: "{{fields.label}}"
            hint: "The links in the top bar of the homepage, left to right (on phones they appear in the menu that opens from the three-line button). Drag to reorder, add or delete links. Keep it to 8 or fewer so the bar fits. A link to a homepage section disappears by itself while that section is hidden in “Page layout”."
            types:
              - label: "⚓ Jump to a homepage section"
                name: "section"
                widget: "object"
                summary: "{{fields.label}} — jumps to a section"
                fields:
                  - { label: "Link text", name: "label", widget: "string", hint: "The words shown in the top bar." }
                  - label: "Which section"
                    name: "section"
                    widget: "select"
                    options:
                      - { label: "The problem", value: "problem" }
                      - { label: "How it works", value: "how" }
                      - { label: "For brands", value: "brands" }
                      - { label: "Partner wall", value: "partners" }
                      - { label: "For venues", value: "venues" }
                      - { label: "Locations", value: "locations" }
                      - { label: "FAQ", value: "faq" }
                  - { label: "Show as a highlighted button", name: "button", widget: "boolean", default: false, required: false, hint: "Turns the link into the highlighted button (the accent-coloured one), like “Advertise with us”." }
              - label: "🔗 Link to a page or website"
                name: "link"
                widget: "object"
                summary: "{{fields.label}} — {{fields.url}}"
                fields:
                  - { label: "Link text", name: "label", widget: "string", hint: "The words shown in the top bar." }
                  - { label: "Address", name: "url", widget: "string", pattern: ["^(/(?!/)\\S*|#\\S+|https?://\\S+|mailto:\\S+)$", "Start with / for a page on this site (e.g. /about/), /#faq for a section of the homepage, # for a spot on the same page, https:// for another website, or mailto: for an email link. An address like www.example.com must start with https://."], hint: "Where the link goes. Type / for a page on this site (e.g. /about/), /#faq for a section of the homepage, #faq for a spot on the same page, https:// (or http://) for another website, or mailto: for an email link. The box refuses anything else, because an address such as www.example.com or about would quietly turn into a link to the homepage." }
                  - { label: "Show as a highlighted button", name: "button", widget: "boolean", default: false, required: false, hint: "Turns the link into the highlighted button (the accent-coloured one)." }
              - label: "✉️ Email us"
                name: "email"
                widget: "object"
                summary: "{{fields.label}} — emails the contact address"
                fields:
                  - { label: "Link text", name: "label", widget: "string", hint: "Opens an email to the contact address set in “Site-wide”." }
                  - { label: "Show as a highlighted button", name: "button", widget: "boolean", default: false, required: false }

      - name: "footer"
        label: "🦶 Footer (bottom of every page)"
        file: "src/_data/footer.json"
        preview_path: "/"
        fields:
          - { label: "Tagline under the logo", name: "tagline", widget: "string", hint: "The short sentence under the COVERED logo in the footer of the homepage." }
          - label: "Link columns"
            name: "columns"
            widget: "list"
            label_singular: "column"
            collapsed: true
            max: 4
            summary: "{{fields.heading}}"
            hint: "The columns of links in the footer of the homepage (currently “Explore” and “Partner”). Drag to reorder, add or delete columns."
            fields:
              - { label: "Column heading", name: "heading", widget: "string", hint: "The small capitals heading above the links." }
              - { label: "Screen-reader label", name: "ariaLabel", widget: "string", required: false, hint: "Read aloud by screen readers to describe this group of links, e.g. “Footer — explore”. Not visible. If left empty the column heading is used." }
              - label: "Links"
                name: "links"
                widget: "list"
                label_singular: "link"
                collapsed: false
                max: 12
                summary: "{{fields.label}}"
                hint: "A link to a homepage section disappears by itself while that section is hidden in “Page layout”."
                types:
                  - label: "⚓ Jump to a homepage section"
                    name: "section"
                    widget: "object"
                    summary: "{{fields.label}} — jumps to a section"
                    fields:
                      - { label: "Link text", name: "label", widget: "string" }
                      - label: "Which section"
                        name: "section"
                        widget: "select"
                        options:
                          - { label: "The problem", value: "problem" }
                          - { label: "How it works", value: "how" }
                          - { label: "For brands", value: "brands" }
                          - { label: "Partner wall", value: "partners" }
                          - { label: "For venues", value: "venues" }
                          - { label: "Locations", value: "locations" }
                          - { label: "FAQ", value: "faq" }
                  - label: "🔗 Link to a page or website"
                    name: "link"
                    widget: "object"
                    summary: "{{fields.label}} — {{fields.url}}"
                    fields:
                      - { label: "Link text", name: "label", widget: "string" }
                      - { label: "Address", name: "url", widget: "string", pattern: ["^(/(?!/)\\S*|#\\S+|https?://\\S+|mailto:\\S+)$", "Start with / for a page on this site (e.g. /about/), /#faq for a section of the homepage, # for a spot on the same page, https:// for another website, or mailto: for an email link. An address like www.example.com must start with https://."], hint: "Where the link goes. Type / for a page on this site (e.g. /about/), /#faq for a section of the homepage, #faq for a spot on the same page, https:// (or http://) for another website, or mailto: for an email link. The box refuses anything else, because an address such as www.example.com or about would quietly turn into a link to the homepage." }
                  - label: "✉️ Email us"
                    name: "email"
                    widget: "object"
                    summary: "{{fields.label}} — emails the contact address"
                    fields:
                      - { label: "Link text", name: "label", widget: "string", hint: "Opens an email to the contact address set in “Site-wide”." }
          - { label: "Copyright line", name: "copyright", widget: "string", hint: "Bottom-left of the footer. Write {year} where the current year should appear — it updates itself every January. (Pages other than the homepage show the line without the year.)" }
          - { label: "“Last updated” label", name: "updatedLabel", widget: "string", hint: "The words before the date in the footer, e.g. “Last updated:”." }
          - { label: "Last updated date", name: "lastUpdated", widget: "string", required: false, hint: "Shown after the label in the footer of the homepage. Leave empty to hide the whole “Last updated” line." }
          - { label: "Sign-off message", name: "signOff", widget: "string", required: false, hint: "The handwritten-style message at the bottom of the homepage footer." }
          - { label: "Sign-off emoji", name: "signOffEmoji", widget: "string", required: false, hint: "A single emoji shown after the sign-off message. Decorative only." }
          - label: "Short footer links (About, Privacy and other pages)"
            name: "compactLinks"
            widget: "list"
            label_singular: "link"
            collapsed: true
            max: 6
            summary: "{{fields.label}}"
            hint: "Every page except the homepage has a slim footer: the copyright line plus these links, separated by dots."
            types:
              - label: "🔗 Link to a page or website"
                name: "link"
                widget: "object"
                summary: "{{fields.label}} — {{fields.url}}"
                fields:
                  - { label: "Link text", name: "label", widget: "string" }
                  - { label: "Address", name: "url", widget: "string", pattern: ["^(/(?!/)\\S*|#\\S+|https?://\\S+|mailto:\\S+)$", "Start with / for a page on this site (e.g. /about/), /#faq for a section of the homepage, # for a spot on the same page, https:// for another website, or mailto: for an email link. An address like www.example.com must start with https://."], hint: "Where the link goes. Type / for a page on this site (e.g. /about/), /#faq for a section of the homepage, #faq for a spot on the same page, https:// (or http://) for another website, or mailto: for an email link. The box refuses anything else, because an address such as www.example.com or about would quietly turn into a link to the homepage." }
              - label: "✉️ Email us"
                name: "email"
                widget: "object"
                summary: "{{fields.label}} — emails the contact address"
                fields:
                  - { label: "Link text", name: "label", widget: "string", hint: "Opens an email to the contact address set in “Site-wide”." }

      - name: "homepage"
        label: "🧩 Page layout — order, add & hide sections"
        file: "src/_data/homepage.json"
        preview_path: "/"
        fields:
          - label: "Homepage sections"
            name: "sections"
            label_singular: "section"
            widget: "list"
            hint: "This is the running order of the homepage, top to bottom. Drag sections to reorder the page, untick “Show this section” to hide one without deleting it, and use the add button to drop in your own text, image, number, banner or Q&A blocks. Each built-in section (hero, ticker, FAQ…) should appear only once — if one is added twice, only the first copy is shown on the site. Your own blocks can repeat freely."
            types:
              - label: "🏠 Hero (big opening screen)"
                name: "hero"
                widget: "object"
                summary: "Hero — headline, stamp and buttons"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true, hint: "The hero holds the page's main heading. If you hide it, an invisible fallback heading (the site title) is used so search engines and screen readers still find one — but the page will open more abruptly." }
              - label: "🎞️ Scrolling venue ticker"
                name: "marquee"
                widget: "object"
                summary: "Ticker — the moving strip of venue names"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - label: "Ticker words"
                    name: "items"
                    widget: "list"
                    required: false
                    field: { label: "Word or phrase", name: "item", widget: "string" }
                    hint: "The words that scroll across the moving strip under the hero (Universities, Train stations, Stadiums…), in this order. If you empty the list the strip disappears — to hide it deliberately, untick “Show this section” instead."
                  - { label: "Pause button — screen-reader label", name: "pauseLabel", widget: "string", hint: "Not visible on the page. Read aloud by screen readers for the small pause (⏸) button at the left end of the ticker." }
                  - { label: "Hidden sentence — start", name: "screenReaderIntro", widget: "string", required: false, hint: "Not visible on the page. The ticker is hidden from screen readers, so they read one sentence instead: this start, then your ticker words in lowercase, then the ending. Example: “Target venues include universities, train stations and schools.”" }
                  - { label: "Hidden sentence — word before the last item", name: "screenReaderJoiner", widget: "string", required: false, hint: "Usually “and”. Placed between the second-to-last and last ticker word in the hidden sentence." }
                  - { label: "Hidden sentence — ending", name: "screenReaderEnd", widget: "string", required: false, hint: "Usually a full stop. Added after the last ticker word in the hidden sentence." }
              - label: "📊 The problem (stats & photos)"
                name: "problem"
                widget: "object"
                summary: "The problem — statistics and photo strip"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🔁 The model (Brands pay. You don't.)"
                name: "model"
                widget: "object"
                summary: "The model — how the funding loop works"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "📱 How it works (interactive demo)"
                name: "how"
                widget: "object"
                summary: "How it works — the tap-through machine demo"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "📣 For brands (advertising enquiry)"
                name: "brands"
                widget: "object"
                summary: "For brands — benefits and enquiry form"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🤝 Partner wall"
                name: "partners"
                widget: "object"
                summary: "Partner wall — the reserved logo slots"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🏟️ For venues (hosting enquiry)"
                name: "venues"
                widget: "object"
                summary: "For venues — what we handle and the venue form"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🗺️ Locations (UK map)"
                name: "locations"
                widget: "object"
                summary: "Locations — the UK map and city chips"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "🚀 Vision / roadmap"
                name: "vision"
                widget: "object"
                summary: "Vision — milestones and launch-notify form"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "❓ FAQ"
                name: "faq"
                widget: "object"
                summary: "FAQ — the questions accordion"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
              - label: "✉️ Closing banner (get in touch)"
                name: "cta"
                widget: "object"
                summary: "Closing banner — the big sign-off with email button"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true, hint: "The banner’s heading, text and button label are edited under “Site-wide (title, contact, CTA)”; the fields below are the small extras." }
                  - { label: "Section name — screen-reader label", name: "ariaLabel", widget: "string", hint: "Not visible on the page. Read aloud by screen readers when they reach the closing section (brand animation + banner)." }
                  - { label: "Brand animation — description (accessibility)", name: "videoLabel", widget: "text", hint: "Not visible on the page. Describes the “covered.” animation above the banner for screen-reader users and anyone who can’t see the video." }
                  - { label: "Email subject line", name: "emailSubject", widget: "string", required: false, hint: "The subject that is pre-filled when someone clicks the banner button and their email app opens. The address itself is the contact email under “Site-wide”. Leave empty for no pre-filled subject." }
                  - label: "Brand animation — video"
                    name: "video"
                    widget: "object"
                    required: false
                    hint: "The short “covered.” animation that plays above the closing banner when it scrolls into view. Leave both boxes empty to hide the animation."
                    fields:
                      - { label: "Video file", name: "src", widget: "file", required: false, choose_url: false, pattern: ["^[A-Za-z0-9._-]+\\.([mM][pP]4|[wW][eE][bB][mM]|[mM]4[vV])$", "Pick or upload an .mp4 (or .webm / .m4v) video. The file name may only use letters, numbers, dots, dashes and underscores."], hint: "Upload or pick an .mp4 video — web addresses are not accepted. Leave empty to hide the animation." }
                      - { label: "Cover picture (shown before it plays)", name: "poster", widget: "image", required: false, choose_url: false, pattern: ["^[A-Za-z0-9._-]+\\.([jJ][pP][eE]?[gG]|[pP][nN][gG]|[wW][eE][bB][pP]|[gG][iI][fF]|[aA][vV][iI][fF]|[sS][vV][gG])$", "Pick or upload a picture (.jpg, .png, .webp, .gif, .avif or .svg). The file name may only use letters, numbers, dots, dashes and underscores."], hint: "The still picture shown until the video starts; its shape also sets the shape of the video on the page. Upload a picture or pick one from the library — web addresses are not accepted." }
              - label: "📝 Text section (add your own)"
                name: "textBlock"
                widget: "object"
                summary: "Your text — {{fields.heading}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Small label above heading", name: "kicker", widget: "string", required: false }
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - { label: "Text", name: "body", widget: "markdown" }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets /#our-story scroll straight to it." }
              - label: "🖼️ Image + text (add your own)"
                name: "imageTextBlock"
                widget: "object"
                summary: "Your image + text — {{fields.heading}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Image", name: "image", widget: "image", choose_url: false, pattern: ["^[A-Za-z0-9._-]+\\.([jJ][pP][eE]?[gG]|[pP][nN][gG]|[wW][eE][bB][pP]|[gG][iI][fF]|[aA][vV][iI][fF]|[sS][vV][gG])$", "Pick or upload a picture (.jpg, .png, .webp, .gif, .avif or .svg). The file name may only use letters, numbers, dots, dashes and underscores."], hint: "The picture shown beside the text. Upload a picture or pick one from the library — web addresses are not accepted." }
                  - { label: "Image description (accessibility)", name: "alt", widget: "string" }
                  - { label: "Caption under image", name: "caption", widget: "string", required: false }
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - { label: "Text", name: "body", widget: "markdown" }
                  - { label: "Image on the right?", name: "imageRight", widget: "boolean", default: false }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-story"], hint: "Gives this block its own link — the anchor “our-story” lets /#our-story scroll straight to it." }
              - label: "🔢 Number cards (add your own)"
                name: "statsBlock"
                widget: "object"
                summary: "Your number cards — {{fields.heading}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - label: "Cards"
                    name: "items"
                    widget: "list"
                    fields:
                      - { label: "Big number (e.g. 11% or 20+)", name: "number", widget: "string" }
                      - { label: "Label underneath", name: "label", widget: "string" }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. our-numbers"], hint: "Gives this block its own link — the anchor “our-numbers” lets /#our-numbers scroll straight to it." }
              - label: "📣 Big call-to-action banner (add your own)"
                name: "bannerBlock"
                widget: "object"
                summary: "Your banner — {{fields.title}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", required: false }
                  - { label: "Button text", name: "buttonText", widget: "string", required: false }
                  - { label: "Button link", name: "buttonLink", widget: "string", required: false, pattern: ["^(/(?!/)\\S*|#\\S+|https?://\\S+|mailto:\\S+)$", "Start with / for a page on this site (e.g. /about/), /#faq for a section of the homepage, # for a spot on the same page, https:// for another website, or mailto: for an email link. An address like www.example.com must start with https://."], hint: "Where the button goes. Type / for a page on this site (e.g. /about/), /#faq for a section of the homepage, #faq for a spot on the same page, https:// (or http://) for another website, or mailto: for an email link. The box refuses anything else, because an address such as www.example.com or about would quietly turn into a link to the homepage. The button only appears when it has text; if you leave this empty it links to the homepage." }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. join-us"], hint: "Gives this block its own link — the anchor “join-us” lets /#join-us scroll straight to it." }
              - label: "❓ Questions & answers (add your own)"
                name: "faqBlock"
                widget: "object"
                summary: "Your Q&A — {{fields.heading}}"
                fields:
                  - { label: "Show this section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Heading", name: "heading", widget: "string", required: false }
                  - label: "Questions"
                    name: "items"
                    widget: "list"
                    fields:
                      - { label: "Question", name: "q", widget: "string" }
                      - { label: "Answer", name: "a", widget: "text" }
                  - { label: "Link anchor (optional)", name: "anchor", widget: "string", required: false, pattern: ["^(?!(?:adbar|bbudget|bcompany|bemail|bmsg|bname|brandform|brands|brands-title|btiming|btnreset|btnscan|btnverify|citychips|citydetail|cta|faq|faq-title|hero|herostamp|how|how-title|identvideo|locations|locations-title|machinescreen|machineslot|machinestage|machinestamp|manifesto|mappins|marquee|marqueepause|model|model-title|navlinks|nemail|notifyform|pack|partners|partners-title|phonescreen|pinlive|pinshadow|pinsoon|problem|problem-title|progress|stepper|top|vemail|venueform|venues|venues-title|vision|vision-title|vmsg|vname|vtype|vvenue|year)$)(?!faq-panel-)[a-z0-9-]+$", "Lowercase letters, numbers and dashes only, and not a name the site already uses (like faq or brands) — e.g. more-questions"], hint: "Gives this block its own link — the anchor “more-questions” lets /#more-questions scroll straight to it." }

      - name: "theme"
        label: "🎨 Colours & theme"
        file: "src/_data/theme.json"
        preview_path: "/"
        fields:
          - label: "Page background"
            name: "paper"
            widget: "color"
            allowInput: true
            required: false
            hint: "The main background of the whole site. It is also the colour of text on dark areas (the footer, dark sections and outlined buttons). Note — the COVERED logo colours are part of the logo artwork and cannot be changed here. When changing any colour, keep text/background contrast at least 4.5:1 (webaim.org/resources/contrastchecker). Clearing a colour restores its default."
          - label: "Small panels & tags"
            name: "paper2"
            widget: "color"
            allowInput: true
            required: false
            hint: "A slightly deeper tint for small panels and tags (the mobile menu, the demo phone screen, step numbers and the “roadmap” tag), and the colour of text on the dark sections. Also colours the browser bar on mobile — and the keyboard focus ring on the dark sections, the footer and the closing banner, so keep it light (at least 3:1 contrast against the main text colour)."
          - label: "Backgrounds — partner wall band"
            name: "bandGrass"
            widget: "color"
            allowInput: true
            required: false
            hint: "The background band behind the partner wall."
          - label: "Backgrounds — opening screen band"
            name: "bandLav"
            widget: "color"
            allowInput: true
            required: false
            hint: "The background of the opening screen. You see it behind the scrolling dispenser animation while its pictures load (or if they cannot play)."
          - label: "Backgrounds — how-it-works band"
            name: "bandRosa"
            widget: "color"
            allowInput: true
            required: false
            hint: "The background band behind the interactive demo section."
          - label: "Hover tint on dark areas"
            name: "peach"
            widget: "color"
            allowInput: true
            required: false
            hint: "The light tint used when hovering over footer links and the closing-banner button, and for the “pilot” badge on a selected city button."
          - label: "Main text & dark sections"
            name: "ink"
            widget: "color"
            allowInput: true
            required: false
            hint: "The main text colour. It also fills the dark sections, the closing banner and the phone and machine outlines in the demo, and tints hairlines and card shadows. Keep it dark: it must read clearly on the page background (at least 4.5:1 contrast)."
          - label: "Footer & deepest dark"
            name: "inkDeep"
            widget: "color"
            allowInput: true
            required: false
            hint: "The footer background and the darkest accents (the small labels and full stops on the model and roadmap sections). Also the keyboard focus ring on the ticker, model and roadmap sections, so keep it dark (at least 3:1 contrast against those sections)."
          - label: "Secondary text"
            name: "inkSoft"
            widget: "color"
            allowInput: true
            required: false
            hint: "A softer dark colour for subheadings, descriptions and the paragraphs inside cards."
          - label: "Quiet text (captions & small print)"
            name: "muted"
            widget: "color"
            allowInput: true
            required: false
            hint: "Quieter text such as captions, the statistics source line and small print — keep at least 4.5:1 contrast on the page background."
          - label: "Accent colour (highlights & fills)"
            name: "accent"
            widget: "color"
            allowInput: true
            required: false
            hint: "The brand's primary accent: the reading-progress bar, the active step in the demo, the roadmap section background, the closing-banner button, the full stops after headings on dark sections, and confetti."
          - label: "Button colour (white text on top)"
            name: "accentDeep"
            widget: "color"
            allowInput: true
            required: false
            hint: "The fill of the main buttons, which carry white text — keep it dark enough for that text to stay readable. Also used for strong accents: menu hover, the big statistic numbers, step numbers, the live city's pin and highlighted manifesto words."
          - label: "Accent text on light backgrounds"
            name: "accentDark"
            widget: "color"
            allowInput: true
            required: false
            hint: "The strongest accent: the small uppercase labels above section headings, button hover, the “paid” line on the receipt and keyboard focus outlines on light backgrounds (needs strong contrast)."
          - label: "Small kicker labels (not used yet)"
            name: "kickerBand"
            widget: "color"
            allowInput: true
            required: false
            hint: "Meant for the small uppercase labels above section headings. At the moment those labels follow “Accent text on light backgrounds” instead, so changing this box has no visible effect yet."
          - label: "Status dots & lights"
            name: "grass"
            widget: "color"
            allowInput: true
            required: false
            hint: "The pulsing dot in the opening-screen badge, the status light on the demo machine, footer link hover and one of the confetti colours. Keep it light enough to show on the dark sections."
          - label: "Ticks & completed steps"
            name: "grassDark"
            widget: "color"
            allowInput: true
            required: false
            hint: "Text and icons in this colour on light backgrounds: the tick marks in the venue lists, finished steps in the demo's progress bar and the third roadmap tag."
          - label: "Soft fills (ticker, model section, pills)"
            name: "lavender"
            widget: "color"
            allowInput: true
            required: false
            hint: "The soft highlight colour: the ticker strip, the model section background, the map's land shape, pill and chip backgrounds, the highlighter underline in the opening headline and one of the confetti colours. Keyboard focus rings on the ticker and model section use the “Footer & deepest dark” colour, so keep this light enough for them to stay visible."

      - name: "tokens"
        label: "🔤 Type & spacing"
        file: "src/_data/tokens.json"
        preview_path: "/"
        fields:
          - label: "Fonts"
            name: "fonts"
            widget: "object"
            collapsed: true
            hint: "Choose which of the site’s own fonts is used where. Every value is kept within safe limits, so nothing typed here can break the layout. Clearing a value restores the shipped one."
            fields:
              - label: "Big headline font"
                name: "display"
                widget: "select"
                options:
                  - { label: "Motor (the bold display typeface)", value: "motor" }
                  - { label: "Open Sauce One (the clean paragraph typeface)", value: "openSauce" }
                default: "motor"
                hint: "The typeface of the biggest words: the opening headline, the section titles, the stamp-style quote and the receipt. Only fonts that are already part of the site can be chosen."
              - label: "Heading & label font"
                name: "heading"
                widget: "select"
                options:
                  - { label: "Motor (the bold display typeface)", value: "motor" }
                  - { label: "Open Sauce One (the clean paragraph typeface)", value: "openSauce" }
                default: "openSauce"
                hint: "The typeface of smaller headings, buttons, small labels, card titles and the figures in the statistics."
              - label: "Paragraph font"
                name: "body"
                widget: "select"
                options:
                  - { label: "Motor (the bold display typeface)", value: "motor" }
                  - { label: "Open Sauce One (the clean paragraph typeface)", value: "openSauce" }
                default: "openSauce"
                hint: "The typeface of ordinary paragraphs, form fields and descriptions."
          - label: "Text sizes"
            name: "text"
            widget: "object"
            collapsed: false
            hint: "How big each kind of text is. Every value is kept within safe limits, so nothing typed here can break the layout. Clearing a value restores the shipped one."
            fields:
              - { label: "Overall text size", name: "baseSize", widget: "number", value_type: "int", min: 80, max: 130, step: 1, default: 100, required: false, hint: "Scales ALL text and most spacing on the site at once (100 = normal, 110 = 10% bigger). Visitors who set a larger text size in their browser still get larger text. Allowed range 80 to 130 (%)." }
              - { label: "Small text size", name: "small", widget: "number", value_type: "float", min: 0.7, max: 1.2, step: 0.01, default: 0.93, required: false, hint: "The size of small descriptions, card captions and statistic labels, in rem (1 rem = normal body text). Shipped value 0.93. Allowed range 0.7 to 1.2 (rem)." }
              - label: "Section intro text"
                name: "lead"
                widget: "object"
                collapsed: true
                hint: "The paragraph that sits under each section title. Sizes are in rem (1 rem = normal body text); it grows with the width of the screen between the smallest and the largest size."
                fields:
                  - { label: "Section intro text — smallest size", name: "min", widget: "number", value_type: "float", min: 0.8, max: 2, step: 0.05, default: 1.05, required: false, hint: "On phones the text is never smaller than this. In rem, from 0.8 to 2. Shipped value 1.05." }
                  - { label: "Section intro text — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 6, step: 0.05, default: 2, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen width, from 0 to 6. Shipped value 2." }
                  - { label: "Section intro text — largest size", name: "max", widget: "number", value_type: "float", min: 0.9, max: 3, step: 0.05, default: 1.2, required: false, hint: "On big screens the text is never bigger than this. In rem, from 0.9 to 3. Shipped value 1.2." }
              - label: "Opening-screen intro text"
                name: "heroLead"
                widget: "object"
                collapsed: true
                hint: "The short paragraph under the opening headline (when the animated opening is not showing). Sizes in rem; grows with screen width between the smallest and the largest size."
                fields:
                  - { label: "Opening-screen intro text — smallest size", name: "min", widget: "number", value_type: "float", min: 0.8, max: 2, step: 0.05, default: 1.05, required: false, hint: "On phones the text is never smaller than this. In rem, from 0.8 to 2. Shipped value 1.05." }
                  - { label: "Opening-screen intro text — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 6, step: 0.05, default: 2.2, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen width, from 0 to 6. Shipped value 2.2." }
                  - { label: "Opening-screen intro text — largest size", name: "max", widget: "number", value_type: "float", min: 0.9, max: 3, step: 0.05, default: 1.25, required: false, hint: "On big screens the text is never bigger than this. In rem, from 0.9 to 3. Shipped value 1.25." }
              - label: "Closing-banner heading"
                name: "heading"
                widget: "object"
                collapsed: true
                hint: "The heading inside the closing call-to-action banner. Sizes in rem; grows with screen width between the smallest and the largest size."
                fields:
                  - { label: "Closing-banner heading — smallest size", name: "min", widget: "number", value_type: "float", min: 1, max: 4, step: 0.05, default: 1.8, required: false, hint: "On phones the text is never smaller than this. In rem, from 1 to 4. Shipped value 1.8." }
                  - { label: "Closing-banner heading — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 10, step: 0.05, default: 4, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen width, from 0 to 10. Shipped value 4." }
                  - { label: "Closing-banner heading — largest size", name: "max", widget: "number", value_type: "float", min: 1.2, max: 6, step: 0.05, default: 2.6, required: false, hint: "On big screens the text is never bigger than this. In rem, from 1.2 to 6. Shipped value 2.6." }
              - label: "Statistic figures"
                name: "stat"
                widget: "object"
                collapsed: true
                hint: "The big numbers in the problem section. Sizes in rem; grows with screen width between the smallest and the largest size."
                fields:
                  - { label: "Statistic figures — smallest size", name: "min", widget: "number", value_type: "float", min: 1.2, max: 5, step: 0.05, default: 2.6, required: false, hint: "On phones the text is never smaller than this. In rem, from 1.2 to 5. Shipped value 2.6." }
                  - { label: "Statistic figures — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 10, step: 0.05, default: 5, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen width, from 0 to 10. Shipped value 5." }
                  - { label: "Statistic figures — largest size", name: "max", widget: "number", value_type: "float", min: 1.5, max: 7, step: 0.05, default: 3.4, required: false, hint: "On big screens the text is never bigger than this. In rem, from 1.5 to 7. Shipped value 3.4." }
              - label: "Manifesto quote"
                name: "quote"
                widget: "object"
                collapsed: true
                hint: "The large uppercase quote whose words light up as you scroll. Sizes in rem; grows with screen width between the smallest and the largest size."
                fields:
                  - { label: "Manifesto quote — smallest size", name: "min", widget: "number", value_type: "float", min: 1, max: 4, step: 0.05, default: 1.5, required: false, hint: "On phones the text is never smaller than this. In rem, from 1 to 4. Shipped value 1.5." }
                  - { label: "Manifesto quote — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 8, step: 0.05, default: 2.9, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen width, from 0 to 8. Shipped value 2.9." }
                  - { label: "Manifesto quote — largest size", name: "max", widget: "number", value_type: "float", min: 1.2, max: 5, step: 0.05, default: 2.5, required: false, hint: "On big screens the text is never bigger than this. In rem, from 1.2 to 5. Shipped value 2.5." }
              - label: "Section titles"
                name: "title"
                widget: "object"
                collapsed: true
                hint: "The big title at the top of every section. Sizes in rem; grows with screen width between the smallest and the largest size."
                fields:
                  - { label: "Section titles — smallest size", name: "min", widget: "number", value_type: "float", min: 1.2, max: 6, step: 0.05, default: 2.5, required: false, hint: "On phones the text is never smaller than this. In rem, from 1.2 to 6. Shipped value 2.5." }
                  - { label: "Section titles — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 12, step: 0.05, default: 5.5, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen width, from 0 to 12. Shipped value 5.5." }
                  - { label: "Section titles — largest size", name: "max", widget: "number", value_type: "float", min: 1.8, max: 9, step: 0.05, default: 4.2, required: false, hint: "On big screens the text is never bigger than this. In rem, from 1.8 to 9. Shipped value 4.2." }
              - label: "Opening headline (animated opening)"
                name: "heroPin"
                widget: "object"
                collapsed: true
                hint: "The headline over the scrolling dispenser animation. It also has a height limit, so the headline, buttons and animation always fit the screen: whichever of “grows with width” and “height limit” is smaller wins."
                fields:
                  - { label: "Opening headline (animated opening) — smallest size", name: "min", widget: "number", value_type: "float", min: 1.5, max: 5, step: 0.1, default: 2.6, required: false, hint: "On phones the text is never smaller than this. In rem, from 1.5 to 5. Shipped value 2.6." }
                  - { label: "Opening headline (animated opening) — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 14, step: 0.1, default: 7.2, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen width, from 0 to 14. Shipped value 7.2." }
                  - { label: "Opening headline (animated opening) — height limit", name: "vh", widget: "number", value_type: "float", min: 0, max: 20, step: 0.1, default: 10.5, required: false, hint: "The text can also never be bigger than this share of the screen HEIGHT (in %), so everything fits without scrolling. In % of screen height, from 0 to 20. Shipped value 10.5." }
                  - { label: "Opening headline (animated opening) — largest size", name: "max", widget: "number", value_type: "float", min: 2, max: 9, step: 0.1, default: 5.6, required: false, hint: "On big screens the text is never bigger than this. In rem, from 2 to 9. Shipped value 5.6." }
              - label: "Opening headline (simple opening)"
                name: "display"
                widget: "object"
                collapsed: true
                hint: "The headline of the opening screen when the scrolling animation is switched off or cannot run. Sizes in rem; grows with screen width between the smallest and the largest size."
                fields:
                  - { label: "Opening headline (simple opening) — smallest size", name: "min", widget: "number", value_type: "float", min: 1.5, max: 8, step: 0.05, default: 3.2, required: false, hint: "On phones the text is never smaller than this. In rem, from 1.5 to 8. Shipped value 3.2." }
                  - { label: "Opening headline (simple opening) — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 16, step: 0.05, default: 8.5, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen width, from 0 to 16. Shipped value 8.5." }
                  - { label: "Opening headline (simple opening) — largest size", name: "max", widget: "number", value_type: "float", min: 2, max: 12, step: 0.05, default: 6.5, required: false, hint: "On big screens the text is never bigger than this. In rem, from 2 to 12. Shipped value 6.5." }
          - label: "Line spacing"
            name: "lines"
            widget: "object"
            collapsed: true
            hint: "Space between lines of text. Every value is kept within safe limits, so nothing typed here can break the layout. Clearing a value restores the shipped one."
            fields:
              - { label: "Paragraph line spacing", name: "body", widget: "number", value_type: "float", min: 1.2, max: 2.2, step: 0.05, default: 1.6, required: false, hint: "Space between lines of ordinary text, as a multiple of the text size. 1.6 is airy, 1.3 is tight. Allowed range 1.2 to 2.2." }
              - { label: "Heading line spacing", name: "heading", widget: "number", value_type: "float", min: 0.9, max: 1.6, step: 0.05, default: 1.1, required: false, hint: "Space between lines of smaller headings, as a multiple of the text size. Allowed range 0.9 to 1.6." }
              - { label: "Section title line spacing", name: "title", widget: "number", value_type: "float", min: 0.8, max: 1.5, step: 0.01, default: 0.95, required: false, hint: "Space between lines of section titles. These big titles look best tight; below 0.9 the lines can touch. Allowed range 0.8 to 1.5." }
              - { label: "Opening headline line spacing", name: "display", widget: "number", value_type: "float", min: 0.8, max: 1.4, step: 0.01, default: 0.92, required: false, hint: "Space between lines of the opening headline. Below 0.9 the lines can touch. Allowed range 0.8 to 1.4." }
          - label: "Letter spacing"
            name: "tracking"
            widget: "object"
            collapsed: true
            hint: "Space between letters. Every value is kept within safe limits, so nothing typed here can break the layout. Clearing a value restores the shipped one."
            fields:
              - { label: "Heading letter spacing", name: "heading", widget: "number", value_type: "float", min: -0.06, max: 0.1, step: 0.005, default: -0.02, required: false, hint: "Space between letters of headings and section titles, in em (a fraction of the text size). Negative pulls letters together, positive spreads them. Shipped value -0.02. Allowed range -0.06 to 0.1 (em)." }
              - { label: "Opening headline letter spacing", name: "display", widget: "number", value_type: "float", min: -0.08, max: 0.1, step: 0.005, default: -0.04, required: false, hint: "Space between letters of the opening headline, in em. Negative pulls letters together. Shipped value -0.04. Allowed range -0.08 to 0.1 (em)." }
              - { label: "Small label letter spacing", name: "kicker", widget: "number", value_type: "float", min: 0, max: 0.4, step: 0.01, default: 0.16, required: false, hint: "Space between letters of the small capital labels above section titles (“kickers”), in em. Shipped value 0.16. Allowed range 0 to 0.4 (em)." }
          - label: "Boldness"
            name: "weights"
            widget: "object"
            collapsed: true
            hint: "How bold each kind of text is. Every value is kept within safe limits, so nothing typed here can break the layout. Clearing a value restores the shipped one."
            fields:
              - label: "Big headline weight"
                name: "display"
                widget: "select"
                options:
                  - { label: "Regular (400)", value: "400" }
                  - { label: "Medium (500)", value: "500" }
                  - { label: "Semi-bold (600)", value: "600" }
                  - { label: "Bold (700)", value: "700" }
                default: "400"
                hint: "How bold the big headlines and section titles are."
              - label: "Small label weight"
                name: "label"
                widget: "select"
                options:
                  - { label: "Regular (400)", value: "400" }
                  - { label: "Medium (500)", value: "500" }
                  - { label: "Semi-bold (600)", value: "600" }
                  - { label: "Bold (700)", value: "700" }
                default: "700"
                hint: "How bold the small capital labels above section titles are."
              - label: "Button text weight"
                name: "button"
                widget: "select"
                options:
                  - { label: "Regular (400)", value: "400" }
                  - { label: "Medium (500)", value: "500" }
                  - { label: "Semi-bold (600)", value: "600" }
                  - { label: "Bold (700)", value: "700" }
                default: "600"
                hint: "How bold the text on buttons is."
          - label: "Spacing"
            name: "space"
            widget: "object"
            collapsed: true
            hint: "Space around sections, the page width and the gaps between cards. Every value is kept within safe limits, so nothing typed here can break the layout. Clearing a value restores the shipped one."
            fields:
              - label: "Space above and below each section"
                name: "section"
                widget: "object"
                collapsed: true
                hint: "Sizes in rem. The space grows with the height of the screen (as a % of its height) between the smallest and the largest size."
                fields:
                  - { label: "Space above and below each section — smallest size", name: "min", widget: "number", value_type: "float", min: 2, max: 12, step: 0.5, default: 6, required: false, hint: "On phones the text is never smaller than this. In rem, from 2 to 12. Shipped value 6." }
                  - { label: "Space above and below each section — grows with screen width", name: "fluid", widget: "number", value_type: "float", min: 0, max: 30, step: 0.5, default: 12, required: false, hint: "How fast the text grows as the screen gets wider (in % of the screen width). In % of screen height, from 0 to 30. Shipped value 12." }
                  - { label: "Space above and below each section — largest size", name: "max", widget: "number", value_type: "float", min: 3, max: 18, step: 0.5, default: 10, required: false, hint: "On big screens the text is never bigger than this. In rem, from 3 to 18. Shipped value 10." }
              - { label: "Page content width (widest)", name: "containerMax", widget: "number", value_type: "int", min: 800, max: 1600, step: 10, default: 1120, required: false, hint: "The widest the page content can grow on big screens, in pixels. Shipped value 1120. Allowed range 800 to 1600 (px)." }
              - { label: "Page content width (% of the screen)", name: "containerWidth", widget: "number", value_type: "int", min: 80, max: 100, step: 1, default: 92, required: false, hint: "On smaller screens the content takes this share of the screen width, which sets the side margins (92 leaves 4% on each side). Shipped value 92. Allowed range 80 to 100 (%)." }
              - { label: "Gap between cards", name: "cardGap", widget: "number", value_type: "float", min: 0.5, max: 3, step: 0.05, default: 1.2, required: false, hint: "The space between cards in the statistics, benefits, roadmap and partner grids, in rem (1 rem = normal body text). Shipped value 1.2. Allowed range 0.5 to 3 (rem)." }
          - label: "Corners & shadows"
            name: "shape"
            widget: "object"
            collapsed: true
            hint: "How round the corners are and how strong the soft shadows are. Every value is kept within safe limits, so nothing typed here can break the layout. Clearing a value restores the shipped one."
            fields:
              - { label: "Card corner roundness", name: "radiusCard", widget: "number", value_type: "int", min: 0, max: 40, step: 1, default: 20, required: false, hint: "How rounded the corners of cards, panels and photos are, in pixels (0 = square corners). Shipped value 20. Allowed range 0 to 40 (px)." }
              - label: "Button corners"
                name: "radiusButton"
                widget: "select"
                options:
                  - { label: "Fully round (pill)", value: "pill" }
                  - { label: "Rounded", value: "rounded" }
                  - { label: "Slightly rounded", value: "soft" }
                  - { label: "Square corners", value: "square" }
                default: "pill"
                hint: "The corner shape of the main buttons."
              - label: "Tags, chips & form fields corners"
                name: "radiusPill"
                widget: "select"
                options:
                  - { label: "Fully round (pill)", value: "pill" }
                  - { label: "Rounded", value: "rounded" }
                  - { label: "Slightly rounded", value: "soft" }
                  - { label: "Square corners", value: "square" }
                default: "pill"
                hint: "The corner shape of the small rounded tags, city chips, the menu pills and the launch-notify email field."
              - { label: "Card shadow strength", name: "shadow", widget: "number", value_type: "float", min: 0, max: 0.4, step: 0.01, default: 0.12, required: false, hint: "How dark the soft shadow under cards is (0 = no shadow, 0.4 = strong). The shadow takes its colour from the “Main text & dark sections” colour. Shipped value 0.12. Allowed range 0 to 0.4." }

      - name: "motion"
        label: "🎬 Animations"
        file: "src/_data/motion.json"
        preview_path: "/"
        fields:
          - label: "Animations on/off"
            name: "enabled"
            widget: "boolean"
            default: true
            hint: "Master switch — turn ALL moving effects on/off. Off means nothing moves: everything simply appears in place, exactly as visitors who ask their device for less motion already see it."
          - label: "Overall speed"
            name: "speed"
            widget: "select"
            options:
              - { label: "Slower — calm and gentle", value: "slower" }
              - { label: "Normal — as designed", value: "normal" }
              - { label: "Faster — quick and snappy", value: "faster" }
            default: "normal"
            hint: "How quickly things move — the scrolling ticker, floating decorations, drop-in effects and so on."
          - label: "How sections appear when you scroll"
            name: "reveal"
            widget: "select"
            options:
              - { label: "Rise into place", value: "rise" }
              - { label: "Fade in", value: "fade" }
              - { label: "Off — just appear", value: "off" }
            default: "rise"
            hint: "The little entrance each section makes as it scrolls into view."
          - label: "Opening headline entrance"
            name: "heroIntro"
            widget: "boolean"
            default: true
            hint: "The big headline rising word by word and the stamp slamming down when the page first loads. Off shows them straight away."
          - label: "Floating decorations"
            name: "floatingHearts"
            widget: "boolean"
            default: true
            hint: "The hearts and product packs gently bobbing around the opening screen. Off keeps them visible but still."
          - label: "Scrolling venue ticker"
            name: "marquee"
            widget: "boolean"
            default: true
            hint: "Whether the strip of venue names glides along by itself. Off keeps the strip on the page but still."
          - label: "Counting numbers"
            name: "counters"
            widget: "boolean"
            default: true
            hint: "The statistics counting up from zero as they come into view. Off shows the final numbers immediately."
          - label: "Production line"
            name: "conveyor"
            widget: "boolean"
            default: true
            hint: "The conveyor belt of product packs rolling across the roadmap section. Off keeps the packs visible but still."
          - label: "Map pins dropping in"
            name: "mapPinDrop"
            widget: "boolean"
            default: true
            hint: "The city pins bouncing onto the UK map when it scrolls into view. Off shows the pins straight away."
          - label: "Confetti"
            name: "confetti"
            widget: "boolean"
            default: true
            hint: "The little burst of confetti when the demo dispenses a pack and when the map pins land."
          - label: "Reading progress bar"
            name: "scrollProgress"
            widget: "boolean"
            default: true
            hint: "The thin accent-coloured line along the very top of the page that fills up as you scroll."

      - name: "hero"
        label: "🏠 Hero (top of page)"
        file: "src/_data/hero.json"
        preview_path: "/"
        fields:
          - { label: "Badge text", name: "badge", widget: "string", hint: "The small pill with the pulsing dot above the headline." }
          - { label: "Headline — main part", name: "headlineMain", widget: "string", hint: "The big page heading. It runs straight on into the highlighted part below, on the same line." }
          - { label: "Headline — highlighted part", name: "headlineAccent", widget: "string", hint: "The second half of the big page heading, drawn with a highlighter-style underline (in the soft-fill colour from “Colours & theme”)." }
          - { label: "Stamp text", name: "stamp", widget: "string", hint: "The ink-stamp that slams down under the headline as the dispenser animation finishes." }
          - { label: "Subheading", name: "subhead", widget: "text", hint: "The paragraph under the stamp." }
          - { label: "Button — brand CTA", name: "ctaBrand", widget: "string", hint: "Solid button that jumps to the “For brands” section. Only shown while that section is switched on." }
          - { label: "Button — venue CTA", name: "ctaVenue", widget: "string", hint: "Outlined button that jumps to the “For venues” section. Only shown while that section is switched on." }
          - { label: "Scroll-down link text", name: "scrollText", widget: "string", hint: "Small link under the buttons that jumps to the “problem” section. Only shown while that section is switched on." }
          - { label: "Section name — screen-reader label", name: "sectionLabel", widget: "string", hint: "Not visible on the page. Read aloud by screen readers when they reach the hero (the opening screen)." }

      - name: "problem"
        label: "📊 The Problem section"
        file: "src/_data/problem.json"
        preview_path: "/"
        fields:
          - { label: "Kicker (small label above heading)", name: "kicker", widget: "string", hint: "The small label above the heading of the problem section, e.g. “The problem”." }
          - { label: "Heading (line breaks allowed, e.g. <br />)", name: "title", widget: "string", hint: "The big heading at the top of the problem section. Type <br /> where you want a line break." }
          - { label: "Subheading", name: "subtitle", widget: "text", hint: "The paragraph under the heading." }
          - { label: "Manifesto (lights up word by word as visitors scroll; wrap a word in *stars* to highlight it in the accent colour)", name: "manifesto", widget: "text", required: false, hint: "The big statement that lights up as visitors scroll. Leave empty to hide the manifesto and its photo." }
          - label: "Manifesto photo"
            name: "manifestoPhoto"
            widget: "object"
            required: false
            hint: "The photo shown beside the manifesto (only shown when the manifesto is filled in)."
            fields:
              - { label: "Photo", name: "src", widget: "image", required: false, choose_url: false, pattern: ["^[A-Za-z0-9._-]+\\.([jJ][pP][eE]?[gG]|[pP][nN][gG]|[wW][eE][bB][pP]|[gG][iI][fF]|[aA][vV][iI][fF]|[sS][vV][gG])$", "Pick or upload a picture (.jpg, .png, .webp, .gif, .avif or .svg). The file name may only use letters, numbers, dots, dashes and underscores."], hint: "Upload a picture or pick one from the library — web addresses are not accepted. Leave empty to show the manifesto without a photo." }
              - { label: "Photo description (accessibility)", name: "alt", widget: "text", required: false, hint: "Read aloud by screen readers; describe what the photo shows." }
          - label: "Statistics"
            name: "stats"
            label_singular: "statistic"
            widget: "list"
            summary: "{{fields.number}}{{fields.suffix}} — {{fields.label}}"
            hint: "The big counting-up numbers in the row of cards. They count up from 0 as visitors scroll."
            fields:
              - { label: "Number", name: "number", widget: "number", value_type: "int", min: 0, max: 1000000, hint: "A whole number. It counts up from 0 when the card scrolls into view." }
              - { label: "Unit shown after the number", name: "suffix", widget: "string", required: false, hint: "Shown straight after the number, e.g. % (leave empty for none)." }
              - { label: "Label text", name: "label", widget: "text", hint: "The sentence under the number." }
          - { label: "Source — label", name: "sourceLabel", widget: "string", required: false, hint: "The word before the source link under the statistics, e.g. “Source:”. Leave empty for none." }
          - { label: "Source citation text", name: "sourceText", widget: "string", required: false, hint: "The clickable name of the source under the statistics. Leave empty to hide the whole source line." }
          - { label: "Source URL", name: "sourceUrl", widget: "string", required: false, pattern: ["^(/(?!/)\\S*|#\\S+|https?://\\S+|mailto:\\S+)$", "Start with / for a page on this site (e.g. /about/), /#faq for a section of the homepage, # for a spot on the same page, https:// for another website, or mailto: for an email link. An address like www.example.com must start with https://."], hint: "Where the source link under the statistics goes: the full web address of the source, starting with https://. A page on this site (starting with /) also works, but the box refuses anything else because it would quietly turn into a link to the homepage." }
          - label: "Photos"
            name: "photos"
            label_singular: "photo"
            widget: "list"
            summary: "{{fields.caption}}"
            hint: "The strip of tilted photo cards under the statistics. Drag to reorder."
            fields:
              - { label: "Photo", name: "src", widget: "image", choose_url: false, pattern: ["^[A-Za-z0-9._-]+\\.([jJ][pP][eE]?[gG]|[pP][nN][gG]|[wW][eE][bB][pP]|[gG][iI][fF]|[aA][vV][iI][fF]|[sS][vV][gG])$", "Pick or upload a picture (.jpg, .png, .webp, .gif, .avif or .svg). The file name may only use letters, numbers, dots, dashes and underscores."], hint: "The photo for this card. Upload a picture or pick one from the library — web addresses are not accepted." }
              - { label: "Rotation (degrees)", name: "tilt", widget: "number", value_type: "float", min: -10, max: 10, step: 0.5, default: 0, hint: "How far the card is tilted, from -10 to 10 degrees. Negative leans left, positive leans right." }
              - { label: "Alt text (accessibility)", name: "alt", widget: "text", hint: "Read aloud by screen readers; describe what the photo shows." }
              - { label: "Caption", name: "caption", widget: "string", hint: "The handwritten caption under the photo." }

      - name: "model"
        label: "🔁 The Model (Brands pay. You don't.)"
        file: "src/_data/model.json"
        preview_path: "/"
        fields:
          - { label: "Kicker", name: "kicker", widget: "string", hint: "The small label above the heading of the model section." }
