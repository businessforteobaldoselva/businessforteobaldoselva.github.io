              - { label: "Cover picture (shown before it plays)", name: "poster", widget: "image", required: false, choose_url: false, pattern: ["^[A-Za-z0-9._-]+\\.([jJ][pP][eE]?[gG]|[pP][nN][gG]|[wW][eE][bB][pP]|[gG][iI][fF]|[aA][vV][iI][fF]|[sS][vV][gG])$", "Pick or upload a picture (.jpg, .png, .webp, .gif, .avif or .svg). The file name may only use letters, numbers, dots, dashes and underscores."], hint: "The still picture shown until the video starts. Use a picture with the same shape as the video. Upload a picture or pick one from the library — web addresses are not accepted." }
