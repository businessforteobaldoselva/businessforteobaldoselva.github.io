              - { label: "Brand line (top)", name: "brand", widget: "string", required: false, hint: "The big name at the top of the receipt. A brand-coloured full stop is added after it automatically." }
              - { label: "Small line under the brand", name: "meta", widget: "string", required: false, hint: "e.g. the dispenser number and town." }
              - label: "Receipt lines"
                name: "rows"
                label_singular: "line"
                widget: "list"
                required: false
                summary: "{{fields.label}} — {{fields.value}}"
                hint: "The itemised lines above the total (name on the left, price on the right)."
                fields:
                  - { label: "Item", name: "label", widget: "string" }
                  - { label: "Price / value", name: "value", widget: "string" }
              - label: "Total line"
                name: "total"
                widget: "object"
                required: false
                hint: "The bold total line under the items. Leave both boxes empty for no total line."
                fields:
                  - { label: "Total — label", name: "label", widget: "string", required: false }
                  - { label: "Total — value", name: "value", widget: "string", required: false }
              - { label: "“Paid” line", name: "paid", widget: "string", required: false, hint: "The line under the total saying who paid." }
              - { label: "Handwritten sign-off", name: "script", widget: "string", required: false, hint: "The script-font line at the very bottom of the receipt." }

