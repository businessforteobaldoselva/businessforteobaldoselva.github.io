<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>The website editor has moved</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 24px 16px; font: 18px/1.5 system-ui, sans-serif; background: #fff8ef; color: #1d2b22; }
    main { max-width: 36rem; margin: 8vh auto 0; }
    h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 1rem; }
    @media (prefers-color-scheme: dark) { body { background: #1d2b22; color: #fff8ef; } }
  </style>
</head>
<body>
  <main>
    <h1>The old website editor has been retired</h1>
    <p>COVERED now edits the site on the page itself, with COVERED Studio.</p>
    <p>Ask Teo for a sign-in, open a preview of the site, and add <strong>?studio=1</strong> to the end of the address.</p>
  </main>
</body>
</html>
