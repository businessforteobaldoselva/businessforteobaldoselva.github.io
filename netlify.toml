[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Canonicalise every alias onto https://coveredaccess.com
[[redirects]]
  from = "https://coveredaccess.co.uk/*"
  to = "https://coveredaccess.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://coveredaccess.co.uk/*"
  to = "https://coveredaccess.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.coveredaccess.co.uk/*"
  to = "https://coveredaccess.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.coveredaccess.co.uk/*"
  to = "https://coveredaccess.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# An SVG opened on its own address must never run script on this domain (belt and braces next to
# scripts/check-images.js): it still works as a picture inside a page.
[[headers]]
  for = "/images/*.svg"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hero scroll-scrub frame sequence: 145 stills, content-stable — cache hard
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pictures generated by the build (lib/eleventy/images.js): the file name holds a hash of the
# picture's bytes, so a changed picture always gets a new URL - cache hard
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
